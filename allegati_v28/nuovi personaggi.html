<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuovi personaggi</title>
<style>
  :root{--bg:#e9ebf0;--line:#cfd4de;--ink:#1c2030;--panel:rgba(255,255,255,.88);--edge:#b6bdcc;--acc:#3949ab;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f2b;--line:#2b3144;--ink:#eef0ff;--panel:rgba(30,35,52,.9);--edge:#46506e;--acc:#8c9bff}}
  :root[data-theme="dark"]{--bg:#1b1f2b;--line:#2b3144;--ink:#eef0ff;--panel:rgba(30,35,52,.9);--edge:#46506e;--acc:#8c9bff}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none;font-size:12px}
  #top b{font-size:16px;letter-spacing:2px}
  #info{position:fixed;left:50%;transform:translateX(-50%);top:calc(46px + env(safe-area-inset-top,0px));background:var(--panel);border:2px solid var(--edge);padding:6px 12px;font-size:12px;text-align:center;max-width:92vw}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:2px solid var(--edge);padding:8px 12px;cursor:pointer}
  button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div id="top"><b>NUOVI PERSONAGGI</b><span>trascina: ruota · rotella: zoom</span></div>
<div id="info"></div>
<div id="bar"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= HELPER =================
const V=.1;                                   // 1 voxel = 0.1 unita
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;
const MC={},M=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
const TM=cv=>{const t=new THREE.CanvasTexture(cv);t.magFilter=t.minFilter=THREE.NearestFilter;return new THREE.MeshLambertMaterial({map:t});};
const cvs=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;};
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w||1,h||1);};
const box=(p,w,h,d,x,y,z,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w*V,h*V,d*V),m);o.position.set(x*V,y*V,z*V);o.castShadow=true;p.add(o);return o;};
const F=(base,o)=>{o=o||{};return [o.r||base,o.l||base,o.t||base,o.b||base,o.f||base,o.k||base].map(x=>typeof x==='number'?M(x):x);}; // +x,-x,+y,-y,+z(fronte),-z(retro)
const DOWN=new THREE.Vector3(0,-1,0), AX=new THREE.Vector3(1,0,0);
const qd=d=>new THREE.Quaternion().setFromUnitVectors(DOWN,new THREE.Vector3(d[0],d[1],d[2]).normalize());

// braccio a 2 segmenti: la posa si da' con due direzioni (spalla->gomito, gomito->mano); x e' specchiata da s
function arm(p,s,x,y,a){
  const sh=new THREE.Group();sh.position.set(x*V,y*V,0);p.add(sh);
  const base=qd([a.d1[0]*s,a.d1[1],a.d1[2]]);sh.quaternion.copy(base);
  box(sh,a.w,a.l1,a.d,0,-a.l1/2,0,a.m1);
  if(a.up)a.up(sh,s);
  const el=new THREE.Group();el.position.y=-a.l1*V;sh.add(el);
  el.quaternion.copy(base).invert().multiply(qd([a.d2[0]*s,a.d2[1],a.d2[2]]));
  box(el,a.w*.95,a.l2,a.d*.95,0,-a.l2/2,0,a.m2||a.m1);
  const hd=new THREE.Group();hd.position.y=-a.l2*V;el.add(hd);
  if(a.hand)a.hand(hd,s);
  return {sh,base,hold:!!a.hold,s};
}
function leg(p,s,gap,hy,a){const g=new THREE.Group();g.position.set(s*gap*V,hy*V,0);p.add(g);box(g,a.w,a.l,a.d,0,-a.l/2,0,a.m);if(a.ex)a.ex(g,s);return g;}
function head(p,y,o){
  const h=new THREE.Group();h.position.y=y*V;p.add(h);
  box(h,o.w||8,8,o.d||8,0,4,0,F(o.skin,{f:o.front,r:o.sr||o.side,l:o.sl||o.side,t:o.top,k:o.back}));
  box(h,o.neck||3,1.6,o.neck||3,0,-.6,0,M(o.skin));
  return h;
}
const hand=(hd,skin,w)=>box(hd,w||3.4,3,w||3.4,0,-1.5,0,M(skin));
const FACE=(sk,fn)=>TM(cvs(16,16,g=>{R(g,sk,0,0,16,16);fn(g);}));
const SIDE=(sk,hc,hn,bc)=>FACE(sk,g=>{R(g,hc,0,0,16,hn);if(bc)R(g,bc,0,10,16,6);R(g,'#cf9873',6,6,3,4);});
const D1=[.08,-1,0],D2=[.05,-1,.15];
function person(o){
  const root=new THREE.Group(),b=new THREE.Group();root.add(b);
  const hy=o.hip||16,th=o.th||14,tw=o.tw||11,td=o.td||6,aw=o.aw||4,ad=o.ad||4.4;
  const legs=[-1,1].map(s=>leg(b,s,o.gap||2.5,hy,{w:o.lw||4.8,l:o.ll||hy,d:o.ld||5.6,m:o.lm,ex:o.lex}));
  box(b,tw,th,td,0,hy+th/2,0,F(o.tc,{f:o.tf,k:o.tk,r:o.tr,l:o.tl}));
  if(o.bd)o.bd(b,hy,th,tw,td);
  const h=head(b,hy+th,{skin:o.skin,front:o.ff,side:o.fs,sr:o.fsr,sl:o.fsl,top:M(o.ht||o.skin),back:M(o.hb||o.skin),w:o.hw,d:o.hdp,neck:o.neck});
  if(o.hdec)o.hdec(h);
  const ax=tw/2+aw/2-.2,ay=hy+th-1.5;
  const arms=[1,-1].map(s=>arm(b,s,s*ax,ay,Object.assign({w:aw,l1:6.5,l2:6.5,d:ad,m1:o.am1||M(o.skin),m2:o.am2,d1:D1,d2:D2,hand:hd=>hand(hd,o.skin)},o.arm(s))));
  return {root,body:b,legs,arms};
}
const sleeve=(c,aw,ad,len)=>sh=>box(sh,aw+.6,len||3.8,ad+.6,0,-(len||3.8)/2,0,M(c));
const shoes=(g,c,sole,y)=>{box(g,5.2,3.2,8.4,0,y,1.5,M(c));box(g,5.4,1.1,8.8,0,y-1.05,1.5,M(sole));box(g,4.6,1.2,2.6,0,y+1.5,3.7,M(c));};

// ================= PERSONAGGI: Il bello, Io sportivo, Il cuoco hockeista, Il divino e il velociraptor =================
function bello(){
  const skin=0xf5b88e,sk='#f5b88e',blk=0x101114,yl=M(0xf3c81c),yd=M(0xd9a812);
  const tf=TM(cvs(22,28,g=>{R(g,'#101114',0,0,22,28);R(g,'#25262c',11,3,1,10);R(g,'#25262c',2,13,8,1);R(g,'#25262c',12,13,8,1);R(g,'#1c1d22',7,0,8,1);R(g,'#1c1d22',4,20,14,1);}));
  return person({skin,tc:blk,tf,hip:17,th:14,tw:13.6,td:7,aw:5.4,ad:5.6,neck:4.6,hw:9,hdp:8.4,lm:M(0x3ea6e0),lw:5.2,
    lex:g=>{box(g,5.6,2,6,0,-11.8,0,M(0x5cbaee));box(g,5.8,3.6,9.2,0,-14.8,1.6,M(0x18181c));box(g,6,1.2,9.6,0,-16.4,1.6,M(0x0a0a0c));},
    ff:FACE(sk,g=>{R(g,'#f3c81c',0,0,16,3);R(g,'#f3c81c',0,3,2,5);R(g,'#f3c81c',14,3,2,5);R(g,'#0c0c10',1,5,14,3);R(g,'#3a4a68',3,5,3,1);R(g,'#3a4a68',10,5,3,1);
      R(g,'#d9916a',7,8,2,2);R(g,'#b85a50',6,12,4,1);R(g,'#e39e78',5,14,6,1);R(g,'#e8a578',2,9,1,5);R(g,'#e8a578',13,9,1,5);}),
    fs:SIDE(sk,'#f3c81c',5),ht:0xf3c81c,hb:0xf3c81c,
    bd:(b,hy,th,tw,td)=>box(b,tw+9.8,3.2,td+.8,0,hy+th-.6,0,M(blk)),
    hdec:h=>{box(h,9.4,2.2,8.8,0,8.2,0,yl);box(h,9.4,5,1.4,0,5.5,-4.4,yl);[-1,1].forEach(sx=>box(h,1,3.6,7,sx*4.7,6.2,-.3,yl));box(h,8,1.6,2.4,0,8.9,3.2,yd);
      [2.6,3.8,4.8,5.4,4.8,3.8,2.6].forEach((hh,i)=>box(h,1.3,hh,5.6,(i-3)*1.3,9.3+hh/2,1.2+(3-Math.abs(i-3))*.4,i%2?yd:yl));   // ciuffo
      box(h,9.6,2.4,.9,0,4.8,4.5,M(0x0c0c10));box(h,2.2,.7,.3,-2.6,5.4,5,M(0x4a5a78));box(h,2.2,.7,.3,2.6,5.4,5,M(0x4a5a78));   // occhiali da sole
      [-1,1].forEach(sx=>box(h,.7,.8,8,sx*4.8,5,.3,M(0x0c0c10)));box(h,5,2.6,1.2,0,1.2,4.5,M(skin));},                          // mento
    arm:s=>({d1:[.18,-1,0],up:sleeve(blk,5.4,5.6,4.4),hand:hd=>hand(hd,skin,5)})});
}

function pallone(){
  const t=TM(cvs(32,16,g=>{R(g,'#f4f4f4',0,0,32,16);[[2,3],[10,3],[18,3],[26,3],[6,9],[14,9],[22,9],[30,9]].forEach(([x,y])=>R(g,'#16161a',x,y,3,3));}));
  const o=new THREE.Mesh(new THREE.SphereGeometry(4.6*V,16,12),t);o.position.set(-2.5*V,4.6*V,10.4*V);o.castShadow=true;return o;
}
function sportivo(){
  const skin=0xe8b48a,sk='#e8b48a',mar=0x8e1a1f,gold='#e6b422',hc='#3b2a20',cm=M(0x3b2a20);
  const tf=TM(cvs(22,26,g=>{R(g,'#8e1a1f',0,0,22,26);R(g,gold,7,0,8,1);R(g,sk,9,0,4,1);R(g,gold,8,1,1,1);R(g,gold,13,1,1,1);R(g,sk,10,1,2,1);R(g,gold,9,2,4,1);
    R(g,gold,14,6,4,5);R(g,'#8e1a1f',15,7,2,3);R(g,gold,15,8,2,1);R(g,gold,4,6,4,1);R(g,gold,5,7,3,1);}));
  const tk=TM(cvs(22,26,g=>{R(g,'#8e1a1f',0,0,22,26);R(g,'#7a1519',0,0,22,2);['010110010010111','111101101101111'].forEach((b,i)=>{for(let k=0;k<15;k++)if(b[k]==='1')R(g,gold,(i?12:1)+(k%3)*3,5+(k/3|0)*3,3,3);});}));
  const lg=TM(cvs(6,17,g=>{R(g,sk,0,0,6,17);R(g,'#16161a',0,10,6,7);R(g,'#c8c8cc',0,10,6,1);}));
  const num=TM(cvs(8,8,g=>{R(g,'#a01a20',0,0,8,8);['010110010010111','111101101101111'].forEach((b,i)=>{for(let k=0;k<15;k++)if(b[k]==='1')R(g,gold,i*4+k%3,1+(k/3|0),1,1);});}));
  
  const P=person({skin,tc:mar,tf,tk,hip:17,th:14,tw:12.4,td:6,aw:4.4,ad:4.6,lm:lg,
    lex:(g,s)=>{box(g,5.5,7.6,6.2,0,-3.8,0,s===1?F(0xa01a20,{f:num}):M(0xa01a20));shoes(g,0xe0b44a,0x2a2620,-15.4);},
    ff:FACE(sk,g=>{R(g,hc,0,0,16,3);R(g,hc,0,3,2,2);R(g,hc,14,3,2,2);R(g,'#2a1c14',3,5,4,1);R(g,'#2a1c14',9,5,4,1);R(g,'#2a1c14',4,4,2,1);R(g,'#2a1c14',10,4,2,1);R(g,'#1a120e',3,6,3,1);R(g,'#1a120e',10,6,3,1);R(g,'#f6f0e8',3,7,3,1);R(g,'#f6f0e8',10,7,3,1);
      R(g,'#4a8fa0',4,7,2,1);R(g,'#4a8fa0',11,7,2,1);R(g,'#c4885f',7,9,2,1);R(g,'#ec9f84',2,10,2,1);R(g,'#ec9f84',12,10,2,1);R(g,'#b86a62',6,12,4,1);R(g,'#b86a62',5,11,1,1);R(g,'#b86a62',10,11,1,1);R(g,'#cf8478',7,13,2,1);}),
    fs:SIDE(sk,hc,4),ht:0x3b2a20,hb:0x3b2a20,
    hdec:h=>{box(h,8.8,2.2,8.8,0,8.3,0,cm);box(h,6.4,1.6,3.6,.4,9.4,1.4,cm);box(h,4,1.2,3,-.6,10.4,.6,M(0x4a3628));box(h,8.8,1.4,1.4,0,7.3,3.9,cm);box(h,8.8,5,1.2,0,5.5,-4.3,cm);[-1,1].forEach(sx=>box(h,.9,3,7,sx*4.4,6.3,-.3,cm));},
    arm:s=>s===1?{up:sh=>{sleeve(mar,4.2,4.6,4)(sh);box(sh,4.8,1.6,5.2,0,-5.4,0,M(0xf2f2f2));}}   // fascia da capitano
               :{up:sleeve(mar,4.2,4.6,4)}});                                              // braccio libero
  P.root.add(pallone());return P;
}

function cuoco(){
  const skin=0x5a3a28,sk='#5a3a28',oli=0xd9c9a0,br=0x1a1a1e,wd=0xb07a3a;
  return person({skin,tc:oli,hip:17,th:14,tw:13.6,td:8,aw:5.8,ad:5.8,neck:6.4,hw:9,hdp:8.6,gap:2.8,lm:M(0x7d828a),lw:5.4,ld:5.8,
    lex:g=>{shoes(g,0x1a1a20,0x2a2a30,-14.4);box(g,.9,1.4,10.4,0,-16.3,1.5,M(0xcfd4dc));},   // pattino col lama
    ff:FACE(sk,g=>{R(g,'#e9e3c4',2,1,12,14);R(g,'#c9c2a0',2,1,12,1);R(g,'#c9c2a0',2,14,12,1);R(g,'#16160f',3,4,4,1);R(g,'#16160f',9,4,4,1);R(g,'#16160f',4,6,3,2);R(g,'#16160f',9,6,3,2);
      R(g,'#8a8466',7,8,2,3);R(g,'#5a563f',4,11,8,1);for(let x=4;x<12;x+=2)R(g,'#5a563f',x,12,1,3);}),   // maschera da hockey
    fs:SIDE(sk,sk,1),ht:0x5a3a28,hb:0x5a3a28,
    bd:(b,hy,th,tw,td)=>{box(b,tw+10.6,2.8,td+.8,0,hy+th-1.2,0,M(0xd9c9a0));box(b,9.8,2,9,0,hy+th-.2,0,M(0xc9b88c));[-1,1].forEach(sx=>{const f=box(b,3.4,1.2,.8,sx*2,hy+th-.5,td/2+.7,M(0xe6d8b4));f.rotation.z=-sx*.6;});                                   // colletto prominente
      box(b,10.6,th+3,.7,0,hy+th-1.5-(th+3)/2,td/2+.3,M(0xf4f1e8));box(b,3.6,2.8,.4,-2.4,hy+3.6,td/2+.7,M(0xdcd8cc));},   // grembiule
    hdec:h=>{box(h,9.6,2.2,9.2,0,8.4,0,M(0xe2ded0));box(h,10.4,5,10.2,0,12,0,M(0xf4f1e8));box(h,11.6,3,11.4,0,15.6,0,M(0xf4f1e8));},   // toque
    arm:s=>s===-1
      ?{m2:M(skin),up:sleeve(oli,5.8,5.8,4.4),hold:1,d1:[.18,-1,0],hand:hd=>{hand(hd,br,5.6);const st=new THREE.Group();st.rotation.x=-.1;hd.add(st);
         box(st,1.2,27,1.5,0,-2.5,.2,M(wd));box(st,1.5,6,1.7,0,-1.5,.2,M(0x1a1a1e));box(st,1.4,2.2,8.6,0,-16,4.2,M(wd));box(st,4.8,1,5.4,0,-16.6,10.2,M(0xd8c47a));box(st,4.4,1.2,5,0,-15.6,10.2,M(0x3a8a3a));box(st,3.4,1,4,0,-14.7,10.2,M(0x2f7a30));box(st,2.2,.8,2.6,0,-14,10.2,M(0x3a8a3a));
         box(st,4.5,.3,.5,0,-15.6,10.2,M(0x246024));box(st,.5,.3,5.1,0,-15.6,10.2,M(0x246024));box(st,1.6,1.4,1.8,0,-16,13.4,M(0x7fb04a));}}   // mazza e guscio di tartaruga
      :{m2:M(skin),up:sleeve(oli,5.8,5.8,4.4),d1:[.18,-1,0],hand:hd=>hand(hd,br,5.6)}});
}

function divino(){
  const skin=0xeab890,sk='#eab890',rb=0xb5533a,hm=M(0x4a2f1c);
  const P=person({skin,tc:rb,hip:17,th:14,tw:10.6,td:6,aw:4.2,ad:4.4,lm:M(rb),lw:4.6,am1:M(rb),
    lex:g=>box(g,4.6,2.4,6,0,-15.8,1.4,M(skin)),
    ff:FACE(sk,g=>{R(g,'#4a2f1c',0,0,16,3);R(g,'#4a2f1c',0,3,2,9);R(g,'#4a2f1c',14,3,2,9);R(g,'#3a2414',3,5,4,1);R(g,'#3a2414',9,5,4,1);R(g,'#f6f0e8',3,7,3,1);R(g,'#f6f0e8',10,7,3,1);
      R(g,'#3a2a20',4,7,2,1);R(g,'#3a2a20',11,7,2,1);R(g,'#c9906a',7,8,2,2);R(g,'#4a2f1c',4,10,8,1);R(g,'#4a2f1c',3,11,10,5);R(g,'#9a5a4a',7,12,2,1);}),
    fs:SIDE(sk,'#4a2f1c',16),ht:0x4a2f1c,hb:0x4a2f1c,
    bd:(b,hy,th,tw,td)=>{box(b,tw+.6,2.2,td+.6,0,hy+3,0,M(0x6f7a45));const cp=box(b,tw+3,15,1.2,0,hy+th/2,-td/2-.8,M(0xa8472f));cp.rotation.x=.2;},
    hdec:h=>{box(h,9.2,2.2,9,0,8.2,0,hm);box(h,9.4,10,1.6,0,3,-4.4,hm);[-1,1].forEach(sx=>box(h,1.3,10,6.5,sx*4.7,3,-.8,hm));box(h,5.6,3.6,1.4,0,1.2,4.1,hm);
      const hl=new THREE.Mesh(new THREE.CylinderGeometry(8.5*V,8.5*V,.8*V,20),new THREE.MeshBasicMaterial({color:0xf0d060}));hl.rotation.x=Math.PI/2;hl.position.set(0,4.5*V,-5.2*V);h.add(hl);},   // aureola
    arm:s=>s===-1?{hold:1,d1:[.35,.55,1],d2:[.35,.55,1],up:sleeve(rb,5,5.2,6.5)}:{hold:1,d1:[.2,-.8,.5],d2:[-.1,-.4,1],up:sleeve(rb,5,5.2,6.5)}});
  P.legs.forEach((l,i)=>{l.rotation.x=-.6;l.rotation.z=(i?1:-1)*.35;});
  return P;
}

function divinoRaptor(){
  const P=divino(),root=new THREE.Group(),m=new THREE.Group();root.add(m);
  const bl=M(0x2f6fd0),dk=M(0x1c4a9a),lt=M(0x9ec8f0),wh=M(0xf4f0e0);
  box(m,7.6,7.5,15,0,18.5,0,bl);box(m,7.2,1.6,14.2,0,15.1,0,lt);[-5.5,-2,1.5,5].forEach(z=>box(m,7.8,7.7,.8,0,18.5,z,dk));
  const legs=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*3.8*V,14*V,1*V);m.add(g);box(g,3.8,7,4.8,0,-3.2,.3,bl);
    const sg=new THREE.Group();sg.position.y=-6.5*V;sg.rotation.x=.7;g.add(sg);box(sg,2.6,9.5,2.8,0,-4.75,0,bl);
    const ft=new THREE.Group();ft.position.y=-9.5*V;ft.rotation.x=-.7;sg.add(ft);box(ft,3,1.4,6.4,0,.4,2.4,dk);box(ft,.8,2.2,.8,0,1.6,.6,wh);return g;});
  [-1,1].forEach(s=>{box(m,1.4,1.4,4,s*3.4,17,8.2,bl);box(m,.5,.5,1.4,s*3.4,17,10.6,wh);});
  const n=new THREE.Group();n.position.set(0,21.5*V,6.4*V);n.rotation.x=.85;m.add(n);box(n,4,10,4,0,5,0,bl);
  const hd=new THREE.Group();hd.position.y=10*V;hd.rotation.x=-.85;n.add(hd);box(hd,4.6,4,5,0,0,1.5,bl);box(hd,3.4,3,5.5,0,-.3,5,bl);
  [-1,1].forEach(s=>{box(hd,.6,1,1.2,s*2.35,1,1.6,M(0xf0d020));box(hd,.4,.5,.4,s*2.6,1,1.8,M(0x101010));box(hd,.5,.5,.3,s*.9,.7,7.8,dk);[3.5,5,6.5,7.5].forEach(z=>box(hd,.5,.9,.5,s*1.5,-2,z,wh));});
  const jw=new THREE.Group();jw.position.set(0,-1.5*V,.6*V);jw.rotation.x=.3;hd.add(jw);box(jw,3.2,1.1,7.4,0,-.5,3.6,lt);box(jw,2,.5,4,0,.1,3.4,M(0xd04a4a));
  const t1=new THREE.Group();t1.position.set(0,19.5*V,-7.4*V);m.add(t1);box(t1,5.2,5.5,8,0,0,-4,bl);
  const t2=new THREE.Group();t2.position.set(0,.4*V,-8*V);t1.add(t2);box(t2,3.6,3.8,8,0,0,-4,bl);
  const t3=new THREE.Group();t3.position.set(0,.3*V,-8*V);t2.add(t3);box(t3,2.2,2.4,8,0,0,-4,dk);
  P.root.position.y=5.5*V;m.add(P.root);
  return {root,body:m,legs,arms:P.arms,fx:t=>{t1.rotation.y=Math.sin(t*3)*.12;t2.rotation.y=Math.sin(t*3)*.18;t3.rotation.y=Math.sin(t*3)*.22;}};
}

// ================= SCENA =================
const CH=[
  {n:'Il bello',mk:bello,info:'Ciuffo biondo gigante, occhiali da sole neri, mento squadrato, maglia nera aderente su muscoli enormi, jeans azzurri col risvolto, anfibi neri.'},
  {n:'Io sportivo',mk:sportivo,info:'Maglia granata con colletto oro e stemma, fascia da capitano al braccio, pantaloncini rossi col 10, calzettoni neri, scarpini dorati, sorriso sicuro, niente barba né tatuaggi, grande 10 sulla schiena, pallone da calcio al piede destro.'},
  {n:'Cuoco hockeista',mk:cuoco,gr:10,info:'Carnagione scura, maglia beige a maniche corte con colletto prominente, pantaloni grigi, toque e grembiule da chef, maschera da hockey, guanti, pattini e mazza con un guscio di tartaruga al posto del disco.'},
  {n:'Il divino e il velociraptor',mk:divinoRaptor,gr:15,info:'Figura con aureola dorata, capelli lunghi, barba e tunica rossa con cintura verde, a cavallo di un velociraptor blu e con il braccio teso in avanti.'},
];
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(34,1,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa0b4,.85));
const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(9,22,14);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:70});scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0xffffff}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function theme(){
  const cs=getComputedStyle(document.documentElement),bg=cs.getPropertyValue('--bg').trim(),ln=cs.getPropertyValue('--line').trim();
  scene.background=new THREE.Color(bg);
  const t=new THREE.CanvasTexture(cvs(64,64,g=>{R(g,bg,0,0,64,64);R(g,ln,0,0,64,1);R(g,ln,0,0,1,64);}));
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(200,200);t.anisotropy=8;ground.material.map=t;ground.material.needsUpdate=true;
}
theme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
const COLS=4;
const chars=CH.map((c,i)=>{const o=c.mk(),row=i/COLS|0,col=i%COLS,n=Math.min(COLS,CH.length-row*COLS);
  o.root.position.set((col-(n-1)/2)*5.8,0,row*7);o.yaw=i*.5;scene.add(o.root);return o;});

// ================= CAMERA / UI =================
const O={th:0,ph:.5,r:20,tx:0,tz:0,ty:2.2,gr:26,gx:0,gz:0};
let sel=-1,walk=false,auto=true,drag=null;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;O.th-=(e.clientX-drag.x)*.006;O.ph=Math.max(.05,Math.min(1.4,O.ph+(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{O.gr=Math.max(5,Math.min(50,O.gr*(1+e.deltaY*.001)));e.preventDefault();},{passive:false});
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code.startsWith('Arrow'))e.preventDefault();});addEventListener('keyup',e=>keys[e.code]=0);
const bar=document.getElementById('bar'),info=document.getElementById('info');
function ui(){
  bar.innerHTML='';
  const add=(t,on,fn)=>{const b=document.createElement('button');b.textContent=t;if(on)b.className='on';b.onclick=fn;bar.appendChild(b);};
  add('Tutti',sel<0,()=>{sel=-1;O.gr=26;ui();});
  CH.forEach((c,i)=>add(c.n,sel===i,()=>{sel=i;O.gr=c.gr||8;ui();}));
  add('Gira: '+(auto?'sì':'no'),auto,()=>{auto=!auto;ui();});
  add('Cammina (WASD/frecce): '+(walk?'sì':'no'),walk,()=>{if(sel<0)sel=0,O.gr=CH[0].gr||8;walk=!walk;ui();});
  info.textContent=sel<0?'I nuovi personaggi voxel. Scegline uno e attiva "Cammina" per muoverlo.':CH[sel].n+' — '+CH[sel].info;
}
ui();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

function animate(c,t,moving){
  const w=moving?Math.sin(t*10):0,amp=moving?.75:0;
  c.legs[0].rotation.x=w*amp;c.legs[1].rotation.x=-w*amp;
  c.arms.forEach(a=>{if(!a.hold)a.sh.quaternion.setFromAxisAngle(AX,-w*amp*.8*a.s).multiply(a.base);});
  c.body.position.y=moving?Math.abs(Math.sin(t*10))*.05:Math.sin(t*2)*.01;
  if(c.walk)c.walk(w,amp);if(c.fx)c.fx(t);
}
let last=performance.now(),T=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;T+=dt;
  chars.forEach((c,i)=>{
    let moving=false;
    if(walk&&i===sel){
      let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
      if(f||r){const l=Math.hypot(f,r);f/=l;r/=l;
        const dx=-Math.sin(O.th)*f+Math.cos(O.th)*r,dz=-Math.cos(O.th)*f-Math.sin(O.th)*r;
        c.root.position.x=Math.max(-24,Math.min(24,c.root.position.x+dx*4*dt));c.root.position.z=Math.max(-24,Math.min(24,c.root.position.z+dz*4*dt));
        let d=Math.atan2(dx,dz)-c.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));c.yaw+=d*Math.min(1,dt*12);moving=true;}
    } else if(auto) c.yaw+=dt*.7;
    c.root.rotation.y=c.yaw;animate(c,T,moving);
  });
  const tgt=sel>=0?chars[sel].root.position:{x:0,z:0};
  const k=Math.min(1,dt*5);O.tx+=(tgt.x-O.tx)*k;O.tz+=(tgt.z-O.tz)*k;O.ty+=((sel>=0?2:2.2)-O.ty)*k;O.r+=(O.gr-O.r)*k;
  cam.position.set(O.tx+O.r*Math.cos(O.ph)*Math.sin(O.th),O.ty+O.r*Math.sin(O.ph),O.tz+O.r*Math.cos(O.ph)*Math.cos(O.th));
  cam.lookAt(O.tx,O.ty,O.tz);
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
