<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parchetto – Mappa</title>
<style>
:root{--bg:#9ec3de;--panel:rgba(20,28,48,.84);--line:#5c6bc0;--fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#6f93ad}}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:var(--fg);touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;pointer-events:none}
.p,.btn{padding:6px 12px;background:var(--panel);border:3px solid var(--line);border-radius:6px;font:700 13px ui-monospace,Menlo,monospace;color:var(--fg);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn{cursor:pointer;pointer-events:auto}.btn:hover,.btn.on{background:#3949ab}
#help{position:fixed;bottom:0;left:0;right:0;font-size:11px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><div class="p">PARCHETTO · mappa</div><button class="btn on" id="b1">Prospettiva</button><button class="btn" id="b2">Dall’alto</button></div>
<div id="help">Trascina per ruotare · rotella / pizzica per lo zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;
document.body.prepend(rd.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9ec3de);
const cam=new THREE.PerspectiveCamera(42,1,.5,300);
sc.add(new THREE.HemisphereLight(0xffffff,0x7c9a60,.9));
const sun=new THREE.DirectionalLight(0xfff2d8,.85);sun.position.set(-22,38,16);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-42,right:42,top:42,bottom:-42,near:1,far:120});sc.add(sun);

// ---------- utilita' (stile pixel-art come nel gioco) ----------
const tex=(w,h,fn,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;if(rep)t.repeat.set(rep[0],rep[1]);return t};
const R=Math.random,M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c,x,y,z,p=sc,cast=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:M(c));m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;p.add(m);return m};
const P=(x,y)=>[(x-740)/20,(y-545)/20];            // pixel dello schizzo -> mondo
const shape=pts=>new THREE.Shape(pts.map(q=>{const [x,z]=P(...q);return new THREE.Vector2(x,-z)}));
const flat=g=>{g.rotateX(-Math.PI/2);return g};
const HGT=.3;

// ---------- terreno ----------
const cob=tex(256,256,(g,s)=>{g.fillStyle='#8a8174';g.fillRect(0,0,s,s);for(let i=0;i<260;i++){g.fillStyle=`hsl(35,${8+R()*10}%,${40+R()*25}%)`;g.beginPath();g.ellipse(R()*s,R()*s,7+R()*7,5+R()*5,R()*3,0,7);g.fill()}},[40,40]);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(170,170),new THREE.MeshLambertMaterial({map:cob,color:0xd9d2c4}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;sc.add(ground);

const grass=tex(128,128,(g,s)=>{g.fillStyle='#5f9a3d';g.fillRect(0,0,s,s);for(let i=0;i<1000;i++){g.fillStyle=`hsla(${80+R()*35},${45+R()*20}%,${28+R()*30}%,.55)`;g.fillRect(R()*s,R()*s,2,3+R()*4)}},[.25,.25]);
// contorno fedele allo schizzo (coordinate in pixel dell'immagine)
const OUT=[[470,270],[520,280],[580,310],[630,355],[665,400],[695,450],[700,485],[745,500],[886,497],[850,540],[852,560],[880,585],[940,590],[1040,568],[1100,560],[1225,551],[1250,570],[1262,610],[1250,670],[1230,705],[1205,730],[1100,740],[1102,703],[865,718],[862,682],[815,633],[790,640],[742,680],[720,720],[705,760],[690,790],[660,822],[630,825],[600,805],[555,762],[582,722],[535,688],[480,640],[420,615],[340,620],[320,610],[280,580],[245,540],[237,500],[250,450],[300,380],[350,320],[400,290]];
const park=new THREE.Mesh(new THREE.ExtrudeGeometry(shape(OUT),{depth:HGT,bevelEnabled:false}),[new THREE.MeshLambertMaterial({map:grass}),M(0xcfc7b4)]);
flat(park.geometry);park.receiveShadow=true;sc.add(park);
const edge=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(OUT.map(q=>{const [x,z]=P(...q);return new THREE.Vector3(x,HGT+.03,z)})),new THREE.LineBasicMaterial({color:0x1c2438}));sc.add(edge);

// ---------- campi ----------
const pitchTex=tex(560,325,(g,w,h)=>{g.fillStyle='#e8641e';g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.fillStyle=R()<.5?'rgba(255,160,90,.16)':'rgba(140,45,10,.14)';g.beginPath();g.arc(R()*w,R()*h,15+R()*40,0,7);g.fill()}
 g.strokeStyle='rgba(255,255,255,.92)';g.lineWidth=5;g.strokeRect(12,12,w-24,h-24);g.beginPath();g.moveTo(w/2,12);g.lineTo(w/2,h-12);g.stroke();g.beginPath();g.arc(w/2,h/2,42,0,7);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(w/2,h/2,6,0,7);g.fill();
 for(const k of[0,1]){const x=k?w-12:12,d=k?-1:1;g.strokeRect(k?x-70:x,h/2-80,70,160);g.strokeRect(k?x-26:x,h/2-40,26,80)}});
const pc=P(503,481),pg=new THREE.Group();pg.position.set(pc[0],HGT+.015,pc[1]);pg.rotation.y=-Math.atan2(130,182);sc.add(pg);
const pm=new THREE.Mesh(flat(new THREE.PlaneGeometry(11.2,6.5)),new THREE.MeshLambertMaterial({map:pitchTex}));pm.receiveShadow=true;pg.add(pm);
for(const s of[-1,1]){const x=s*5.45;box(.12,.12,2.4,0xffffff,x,.9,0,pg);box(.12,.9,.12,0xffffff,x,.45,-1.2,pg);box(.12,.9,.12,0xffffff,x,.45,1.2,pg)}

const courtTex=tex(340,160,(g,w,h)=>{g.fillStyle='#e8641e';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.fillStyle=R()<.5?'rgba(255,160,90,.16)':'rgba(140,45,10,.14)';g.beginPath();g.arc(R()*w,R()*h,10+R()*30,0,7);g.fill()}
 g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=4;g.strokeRect(10,10,w-20,h-20);g.beginPath();g.moveTo(w/2,10);g.lineTo(w/2,h-10);g.stroke();g.beginPath();g.arc(w/2,h/2,26,0,7);g.stroke()});
const cc=P(1147,627),cm=new THREE.Mesh(flat(new THREE.PlaneGeometry(8.5,4)),new THREE.MeshLambertMaterial({map:courtTex}));cm.position.set(cc[0],HGT+.015,cc[1]);cm.rotation.y=.05;cm.receiveShadow=true;sc.add(cm);
box(.1,.9,4,0xeeeeee,cc[0],HGT+.45,cc[1]);

// ---------- laghetto ----------
const POND=[[632,745],[640,714],[668,700],[700,702],[706,724],[692,762],[665,770],[640,764]];
const pcx=P(669,735),rim=new THREE.Mesh(new THREE.ExtrudeGeometry(shape(POND),{depth:.1,bevelEnabled:false}),M(0xb9ad92));flat(rim.geometry);
rim.scale.set(1.12,1,1.12);rim.position.set(pcx[0]*-.12,HGT-.02,pcx[1]*-.12);rim.receiveShadow=true;sc.add(rim);
const wat=tex(128,128,(g,s)=>{const gr=g.createLinearGradient(0,0,0,s);gr.addColorStop(0,'#1f9fe0');gr.addColorStop(1,'#1a7fc4');g.fillStyle=gr;g.fillRect(0,0,s,s);for(let i=0;i<50;i++){g.fillStyle=`rgba(255,255,255,${.1+R()*.25})`;g.fillRect(R()*s,R()*s,6+R()*14,2)}},[.3,.3]);
const water=new THREE.Mesh(flat(new THREE.ShapeGeometry(shape(POND))),new THREE.MeshLambertMaterial({map:wat}));water.position.y=HGT+.1;sc.add(water);

// ---------- alberi voxel ----------
function tree(px,py,s=1){const [x,z]=P(px,py),g=new THREE.Group();g.position.set(x,HGT,z);g.scale.setScalar(s);g.rotation.y=R()*6;
 box(.55,1.3,.55,0x7a4e2a,0,.65,0,g);const C=[0x2f9a38,0x3fae3a,0x52c847];[[2.4,1.7],[1.9,2.5],[1.2,3.2]].forEach(([w,y],i)=>box(w,.85,w,C[i],0,y,0,g));sc.add(g)}
[[400,342,1],[483,313,1],[567,345,.9],[348,425,1],[302,495,1.1],[640,433,1],[354,555,.8],[635,648,1.35],[910,686,1.1],[989,687,.75],[1140,708,.75]].forEach(t=>tree(...t));

// ---------- giochi ----------
const sand=(x,z,w,d)=>box(w,.04,d,0xe6d3a0,x,HGT+.02,z,sc,false);
const [sx,sz]=P(685,573);sand(sx,sz,4.4,3.2);
const sw=[];for(const a of[-1.9,1.9])for(const b of[-.8,.8]){const bar=box(.14,2.5,.14,0xd32f2f,sx+a,HGT+1.25,sz+b);bar.rotation.z=a>0?-.08:.08}
box(4.2,.16,.16,0xb71c1c,sx,HGT+2.5,sz);
for(const a of[-.8,.8]){const pv=new THREE.Group();pv.position.set(sx+a,HGT+2.45,sz);box(.04,1.6,.04,0x444444,-.18,-.8,0,pv);box(.04,1.6,.04,0x444444,.18,-.8,0,pv);box(.6,.08,.3,0xffb300,0,-1.6,0,pv);sc.add(pv);sw.push(pv)}
const [lx,lz]=P(720,550);sand(lx,lz,3,4.2);const sl=new THREE.Group();sl.position.set(lx,HGT,lz-1.1);sc.add(sl);
box(1,1.6,1,0x1e88e5,0,.8,0,sl);box(1.2,.15,1.2,0xfdd835,0,1.68,0,sl);const ramp=box(.7,.1,2.74,0xeeeeee,0,.8,1.32,sl);ramp.rotation.x=.54;
const bn=P(967,621);box(2.2,.5,.85,0xb8bcc6,bn[0],HGT+.25,bn[1]);

// ---------- strada che attraversa la congiunzione ----------
const road=new THREE.Group(),rc=P(790,545);road.position.set(rc[0],0,rc[1]);road.rotation.y=Math.atan2(.27,.96);sc.add(road);
const asph=tex(128,128,(g,s)=>{g.fillStyle='#3c3f46';g.fillRect(0,0,s,s);for(let i=0;i<500;i++){const v=R()<.5?20:90;g.fillStyle=`rgba(${v},${v},${v},${R()*.35})`;g.fillRect(R()*s,R()*s,2,2)}},[1,8]);
const rm=new THREE.Mesh(new THREE.BoxGeometry(3.4,.34,30),new THREE.MeshLambertMaterial({map:asph}));rm.position.y=.17;rm.receiveShadow=true;road.add(rm);
for(const s of[-1,1])box(.9,.42,30,0xbdb7a8,s*2.15,.21,0,road);
for(let z=-14;z<14;z+=1.6)if(Math.abs(z-.8)>1.7)box(.14,.02,.8,0xf5f5f5,0,.35,z+.4,road,false);
for(let i=-3;i<=3;i++)box(.24,.02,2.4,0xffffff,i*.42,.35,.8,road,false);      // strisce pedonali
for(const [s,z] of[[-1,-4.5],[1,5.5],[1,-6.5],[-1,8]]){const x=s*2.2;box(.1,2.6,.1,0x555b66,x,1.6,z,road);box(.5,.18,.3,0xfff3b0,x-s*.2,2.9,z,road,false)}
const cars=[];const CC=['#e53935','#fdd835','#1e88e5','#fb8c00','#8e24aa'];
function car(lane,z,i){const g=new THREE.Group();const m=M(CC[i%5]);box(1.1,.4,2.1,m,0,.36,0,g);box(.9,.36,1.0,0xb3e5fc,0,.74,-.1,g);for(const a of[-.55,.55])for(const b of[-.7,.7])box(.2,.3,.4,0x1c1c1c,a,.15,b,g);
 g.position.set(lane*.8,.34,z);g.rotation.y=lane>0?0:Math.PI;road.add(g);cars.push({g,d:lane>0?1:-1,v:3+R()*2.5})}
car(1,-12,0);car(1,2,2);car(-1,10,1);car(-1,-5,3);car(1,9,4);

// ---------- etichette ----------
function label(t,px,py,y){const [x,z]=P(px,py),c=document.createElement('canvas');c.width=320;c.height=72;const g=c.getContext('2d');g.font='bold 38px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';g.lineWidth=9;g.strokeStyle='#1c2438';g.strokeText(t,160,36);g.fillStyle='#fff';g.fillText(t,160,36);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(6.4,1.44,1);s.position.set(x,y,z);s.renderOrder=9;sc.add(s)}
label('SCIVOLO',724,520,4.6);label('ALTALENA',668,625,3.8);label('LAGHETTO',669,800,2.4);label('VIA DEL PARCO',870,745,2.2);

// ---------- camera orbitale ----------
let V={r:64,f:.8,t:0},G={...V},T=new THREE.Vector3(0,0,1);
function place(){cam.position.set(T.x+V.r*Math.sin(V.f)*Math.sin(V.t),V.r*Math.cos(V.f),T.z+V.r*Math.sin(V.f)*Math.cos(V.t));cam.lookAt(T)}
const ptr=new Map();let pd=0;
rd.domElement.addEventListener('pointerdown',e=>{rd.domElement.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY])});
rd.domElement.addEventListener('pointerup',e=>ptr.delete(e.pointerId));rd.domElement.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
rd.domElement.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;
 if(ptr.size===1){G.t-=(e.clientX-o[0])*.006;G.f=Math.min(1.35,Math.max(.02,G.f-(e.clientY-o[1])*.005));b(0)}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2){const [a,c]=[...ptr.values()],d=Math.hypot(a[0]-c[0],a[1]-c[1]);if(pd)G.r=Math.min(110,Math.max(18,G.r*pd/d));pd=d}else pd=0});
rd.domElement.addEventListener('wheel',e=>{G.r=Math.min(110,Math.max(18,G.r*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
function b(n){b1.classList.toggle('on',n===1);b2.classList.toggle('on',n===2)}
b1.onclick=()=>{G.f=.8;G.t=0;G.r=64;b(1)};b2.onclick=()=>{G.f=.02;G.t=0;G.r=66;b(2)};
function rs(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(cam.aspect<1){G.r=Math.max(G.r,80)}}
addEventListener('resize',rs);rs();

const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 for(const k of['r','f','t'])V[k]+=(G[k]-V[k])*Math.min(1,dt*6);place();
 cars.forEach(c=>{c.g.position.z+=c.d*c.v*dt;if(Math.abs(c.g.position.z)>15)c.g.position.z=-c.d*15});
 sw.forEach((s,i)=>s.rotation.x=Math.sin(t*1.6+i*1.2)*.35);
 wat.offset.x=t*.02;wat.offset.y=Math.sin(t*.5)*.02;
 rd.render(sc,cam)})();
</script>
</body>
</html>
