<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa diroccata – Render 3D</title>
<style>
:root{--bg:#6b747c;--panel:rgba(20,22,30,.86);--line:#7a5c5c;--fg:#fff}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:var(--fg);touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;pointer-events:none}
.p,.btn{padding:6px 12px;background:var(--panel);border:3px solid var(--line);border-radius:6px;font:700 13px ui-monospace,Menlo,monospace;color:var(--fg);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.btn{cursor:pointer;pointer-events:auto}.btn:hover,.btn.on{background:#5a3a3a}
.btn.hz{border-color:#ffd54f;color:#ffd54f}
#help{position:fixed;bottom:0;left:0;right:0;font-size:11px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><div class="p">CASA DIROCCATA</div><button class="btn on" id="b1">Prospettiva</button><button class="btn" id="b2">Dall’alto</button><button class="btn hz" id="b3">⚡ Cavo</button><button class="btn on" id="b4">Etichette</button></div>
<div id="help">Trascina per ruotare · rotella / pizzica per lo zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;document.body.prepend(rd.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x6b747c);sc.fog=new THREE.Fog(0x6b747c,70,150);
const cam=new THREE.PerspectiveCamera(42,1,.5,300);
sc.add(new THREE.HemisphereLight(0xb7c0c8,0x4a4136,.7));
const sun=new THREE.DirectionalLight(0xcfd6dd,.6);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:130});sc.add(sun);

const tex=(w,h,fn,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;if(rep)t.repeat.set(rep[0],rep[1]);return t};
const R=Math.random,M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c,x,y,z,p=sc,cast=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:M(c));m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;p.add(m);return m};
const P=(x,y)=>[(x-480)/30,(y-800)/30];
const shape=pts=>new THREE.Shape(pts.map(q=>{const [x,z]=P(...q);return new THREE.Vector2(x,-z)}));
const flat=g=>{g.rotateX(-Math.PI/2);return g};

// ---------- terreno ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshLambertMaterial({map:tex(128,128,(g,s)=>{g.fillStyle='#4a4338';g.fillRect(0,0,s,s);for(let i=0;i<500;i++){g.fillStyle=`rgba(${R()<.5?20:120},${R()<.5?20:110},${R()<.5?20:95},.3)`;g.fillRect(R()*s,R()*s,2,2)}},[50,50])}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;sc.add(ground);
const dead=tex(128,128,(g,s)=>{g.fillStyle='#656b36';g.fillRect(0,0,s,s);for(let i=0;i<900;i++){g.fillStyle=`hsla(${50+R()*30},${25+R()*15}%,${22+R()*22}%,.6)`;g.fillRect(R()*s,R()*s,1.5,3+R()*4)}},[.25,.25]);
const gm=new THREE.Mesh(flat(new THREE.ShapeGeometry(shape([[30,780],[200,760],[425,775],[450,1000],[640,1000],[650,1300],[480,1345],[300,1320],[40,1330],[10,1000]]))),new THREE.MeshLambertMaterial({map:dead}));gm.position.y=.02;gm.receiveShadow=true;sc.add(gm);
const wt=tex(128,128,(g,s)=>{g.fillStyle='#2d6a82';g.fillRect(0,0,s,s);for(let i=0;i<60;i++){g.fillStyle=`rgba(190,220,230,${.05+R()*.15})`;g.fillRect(R()*s,R()*s,6+R()*14,2)}},[.25,.25]);
const water=new THREE.Mesh(flat(new THREE.ShapeGeometry(shape([[210,-300],[210,110],[195,200],[180,300],[110,370],[55,470],[70,560],[75,640],[40,720],[110,830],[150,990],[110,1090],[70,1160],[15,1225],[-60,1400],[-300,1400],[-300,-300]]))),new THREE.MeshLambertMaterial({map:wt}));water.position.y=.05;sc.add(water);

// ---------- strada ----------
const asph=tex(128,128,(g,s)=>{g.fillStyle='#34373d';g.fillRect(0,0,s,s);for(let i=0;i<500;i++){const v=R()<.5?15:85;g.fillStyle=`rgba(${v},${v},${v},${R()*.35})`;g.fillRect(R()*s,R()*s,2,2)}},[14,1]);
const RZ=P(0,1467)[1];box(100,.12,7.4,new THREE.MeshLambertMaterial({map:asph}),0,.06,RZ,sc,false);
for(let x=-48;x<48;x+=3)box(1.6,.02,.14,0xcfcab8,x,.13,RZ,sc,false);
for(const s of[-1,1])box(100,.02,.16,0x8f8b80,0,.13,RZ+s*3.5,sc,false);

// ---------- muri diroccati con carta da parati staccata ----------
const plaster=new THREE.MeshLambertMaterial({map:tex(128,128,(g,s)=>{g.fillStyle='#5d574e';g.fillRect(0,0,s,s);for(let i=0;i<30;i++){const x=R()*s,y=R()*s,r=10+R()*30,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}g.strokeStyle='rgba(20,15,10,.5)';for(let i=0;i<6;i++){g.beginPath();let x=R()*s,y=R()*s;g.moveTo(x,y);for(let k=0;k<5;k++){x+=R()*16-8;y+=R()*14;g.lineTo(x,y)}g.stroke()}})});
const wp=(c1,c2)=>new THREE.MeshLambertMaterial({side:THREE.DoubleSide,transparent:true,alphaTest:.4,map:tex(64,128,(g,w,h)=>{g.fillStyle=c1;g.fillRect(0,0,w,h);g.fillStyle=c2;for(let x=0;x<w;x+=16)g.fillRect(x,0,6,h);for(let i=0;i<30;i++)g.fillRect(R()*w,R()*h,3,3);
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(20,12,5,.55)');gr.addColorStop(.4,'rgba(20,12,5,0)');gr.addColorStop(1,'rgba(0,0,0,.3)');g.fillStyle=gr;g.fillRect(0,0,w,h);
 g.globalCompositeOperation='destination-out';for(let b=0;b<6;b++){const cx=R()*w,cy=R()*h,r=6+R()*16;g.beginPath();for(let k=0;k<8;k++){const a=k/8*6.28,rr=r*(.6+R()*.6);g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*1.5)}g.fill()}})});
const WP=[wp('#6f6a3c','#58532e'),wp('#6a4b45','#4d3430'),wp('#41564f','#2f423c')];
function peel(x,z,fr,h,m){const g=new THREE.Group(),len=.7+R()*1.3;g.position.set(x,0,z);g.rotation.y=fr;const pv=new THREE.Group();pv.position.y=Math.max(len,R()*h);pv.rotation.x=-(.35+R()*.9);g.add(pv);const q=new THREE.Mesh(new THREE.PlaneGeometry(.3+R()*.3,len),m);q.position.y=-len/2;pv.add(q);sc.add(g)}
function wall(x1,y1,x2,y2){const [a,b]=P(x1,y1),[c,d]=P(x2,y2),hz=y1===y2,L=hz?Math.abs(c-a):Math.abs(d-b),n=Math.max(1,Math.round(L)),u=L/n;
 const mat=WP[(x1<430&&y1>=660&&y1<=768&&y2<=768)?2:(x1>=495&&y1<=768)?1:0];
 for(let i=0;i<n;i++){const cx=hz?a+(i+.5)*u:a,cz=hz?b:b+(i+.5)*u,h=R()<.18?.5+R():2.4+R()*2.8;
  box(hz?u+.02:.3,h,hz?.3:u+.02,plaster,cx,h/2,cz);
  for(const s of[-1,1]){const pl=new THREE.Mesh(new THREE.PlaneGeometry(u,h*.97),mat);pl.position.set(hz?cx:cx+s*.16,h/2,hz?cz+s*.16:cz);pl.rotation.y=hz?(s>0?0:Math.PI):(s>0?Math.PI/2:-Math.PI/2);sc.add(pl);
   if(h>1.8&&R()<.4)peel(hz?cx:cx+s*.17,hz?cz+s*.17:cz,pl.rotation.y,h,mat)}
  if(h<1.6)for(let k=0;k<5;k++){const q=.2+R()*.4,r=box(q,q,q,R()<.5?0x4e4840:0x6a6258,cx+(R()-.5)*3,q/2,cz+(R()-.5)*3);r.rotation.set(R(),R(),R())}}}
[[135,485,245,485],[335,485,495,485],[135,485,135,768],[135,660,370,660],[135,768,270,768],[300,768,430,768],[430,768,430,995],[495,485,495,995],[495,485,635,485],[665,485,720,485],[720,485,720,768],[550,768,720,768],[550,870,675,870],[675,870,675,995],[550,870,550,995],[430,995,555,995],[625,995,625,1290],[427,1290,625,1290],[427,1070,427,1290]].forEach(w=>wall(...w));

// ---------- pavimenti ----------
const wood=tex(128,128,(g,s)=>{g.fillStyle='#3c2f25';g.fillRect(0,0,s,s);for(let y=0;y<s;y+=16){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,y,s,2)}for(let i=0;i<300;i++){g.fillStyle=`rgba(${R()<.5?10:90},${R()<.5?10:70},${R()<.5?10:50},.25)`;g.fillRect(R()*s,R()*s,3,2)}});
const tile=tex(64,64,(g,s)=>{g.fillStyle='#4b5a52';g.fillRect(0,0,s,s);g.fillStyle='#2b342f';for(let i=0;i<s;i+=16){g.fillRect(i,0,2,s);g.fillRect(0,i,s,2)}for(let i=0;i<40;i++){g.fillStyle='rgba(30,20,10,.3)';g.fillRect(R()*s,R()*s,5,4)}});
function floor(x1,y1,x2,y2,t){const [a,b]=P(x1,y1),[c,d]=P(x2,y2),tt=t.clone();tt.needsUpdate=true;tt.repeat.set((c-a)/3,(d-b)/3);box(c-a,.2,d-b,new THREE.MeshLambertMaterial({map:tt}),(a+c)/2,.1,(b+d)/2,sc,false)}
floor(135,485,495,660,wood);floor(135,660,430,768,tile);floor(430,768,550,995,wood);floor(495,485,720,768,wood);floor(550,870,675,995,wood);floor(427,995,625,1290,wood);

// travi crollate e macerie
[[-3,-9,6,.4,.5],[6,3.5,5,2.2,.35],[1,9,7,1.2,.6],[-7,-1,4,.8,.3]].forEach(([x,z,l,ry,rz])=>{const b=box(l,.3,.3,0x2e2118,x,.7,z);b.rotation.set(0,ry,rz)});

// ---------- oggetti ----------
// frigo grande (ribaltato, coperchio aperto)
const fp=P(260,572);box(4.2,1.1,2.5,0xb9b29a,fp[0],.75,fp[1]);box(3.8,.1,2.1,0x111a14,fp[0],1.3,fp[1],sc,false);
const lid=box(4.2,.15,2.5,0xa9a28a,fp[0],2.1,fp[1]-1.8);lid.rotation.x=-1.05;
const fl=new THREE.PointLight(0x5cff9a,.9,7);fl.position.set(fp[0],1.8,fp[1]);sc.add(fl);
// frigo piccolo
const f2=P(471,508);box(1.4,2.6,1.2,0xa8a28e,f2[0],1.5,f2[1]);const dr=box(.1,2.4,1.1,0x8d8776,f2[0]+.7,1.5,f2[1]+1);dr.rotation.y=.9;
// bagno
const tb=P(165,692);box(2,.6,1.8,0x9a9784,tb[0],.5,tb[1]);box(1.7,.1,1.5,0x4a3b24,tb[0],.82,tb[1],sc,false);
const to=P(222,745);box(.7,.5,.9,0x8d8b80,to[0],.45,to[1]);box(.7,.9,.3,0x8d8b80,to[0],.9,to[1]+.6);
const bi=P(160,738);box(.6,.45,.9,0x8d8b80,bi[0],.43,bi[1]);
const si=P(335,750);box(.3,.8,.3,0x8d8b80,si[0],.6,si[1]);box(1,.2,.7,0x8d8b80,si[0],1.1,si[1]);
// fetta di speck gigante
const sp=P(470,632),spt=tex(64,32,(g,w,h)=>{g.fillStyle='#b5575a';g.fillRect(0,0,w,h);for(let i=0;i<14;i++){g.strokeStyle=R()<.6?'#e8cfc8':'#8b3a3d';g.lineWidth=1+R()*2;g.beginPath();g.moveTo(0,R()*h);g.lineTo(w,R()*h);g.stroke()}g.strokeStyle='#4a2a22';g.lineWidth=3;g.strokeRect(0,0,w,h)});
const sm=box(2.6,.35,1.7,new THREE.MeshLambertMaterial({map:spt}),sp[0],.4,sp[1]);sm.rotation.y=.4;
// materasso
const mt=P(660,731),mm=tex(64,32,(g,w,h)=>{g.fillStyle='#a79b78';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=8){g.fillStyle='rgba(60,45,25,.2)';g.fillRect(x,0,2,h)}for(let i=0;i<8;i++){g.fillStyle='rgba(50,30,10,.4)';g.beginPath();g.arc(R()*w,R()*h,3+R()*6,0,7);g.fill()}});
const mx=box(3.3,.45,1.6,new THREE.MeshLambertMaterial({map:mm}),mt[0],.42,mt[1]);mx.rotation.y=.06;
for(let i=0;i<4;i++)box(.06,.35,.06,0x888888,mt[0]+1.3+R()*.3,.75,mt[1]-.6+i*.4,sc,false);
// divano
const dv=P(600,1127);box(1.3,.5,3.5,0x4b5b3c,dv[0],.45,dv[1]);box(.35,1.1,3.5,0x425234,dv[0]+.5,.9,dv[1]);for(const s of[-1,1])box(1.3,.8,.35,0x425234,dv[0],.6,dv[1]+s*1.55);
for(let i=0;i<5;i++)box(.25,.2,.25,0xd8d2c0,dv[0]-.3+R()*.4,.78,dv[1]-1+R()*2);
// TV + mobile
const tv=P(447,1150);box(1.1,.9,3.6,0x3a2a1e,tv[0],.55,tv[1]);box(.4,1.2,2,0x15161a,tv[0],1.5,tv[1]);
const stc=document.createElement('canvas');stc.width=32;stc.height=18;const sg=stc.getContext('2d'),stt=new THREE.CanvasTexture(stc);stt.magFilter=THREE.NearestFilter;
const scr=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1),new THREE.MeshBasicMaterial({map:stt}));scr.position.set(tv[0]+.21,1.5,tv[1]);scr.rotation.y=Math.PI/2;sc.add(scr);
// scala a libretto
const sl=P(465,430),sg2=new THREE.Group();sg2.position.set(sl[0],0,sl[1]);sc.add(sg2);
for(const s of[-.6,.6]){const r=box(.1,2.4,.1,0x7a6850,s,1.1,0,sg2);r.rotation.x=.35}for(let i=0;i<4;i++)box(1.3,.08,.4,0x8a7860,0,.4+i*.55,-i*.18+.2,sg2);

// ---------- alberi e cespugli (tinte spente) ----------
function tree(px,py,s=1){const [x,z]=P(px,py),g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);g.rotation.y=R()*6;box(.6,1.5,.6,0x3d2a1c,0,.75,0,g);[[2.8,2],[2.2,2.9],[1.4,3.7]].forEach(([w,y],i)=>box(w,.9,w,[0x2f4a2e,0x3a5a35,0x466b3f][i],0,y,0,g));sc.add(g)}
tree(480,205,1.4);tree(362,335,1.2);tree(578,330,1.2);
[[300,905],[210,1160]].forEach(([px,py])=>{const [x,z]=P(px,py);box(2.2,1,2.2,0x3d5236,x,.5,z);for(let i=0;i<8;i++)box(.5,.5,.5,0xb86aa0,x+(R()-.5)*2,1.1+R()*.3,z+(R()-.5)*2)});

// ---------- veicoli ----------
const van=new THREE.Group();box(4,1.1,1.9,0x56606b,0,.95,0,van);box(2.2,.8,1.8,0x9fb4c0,.3,1.85,0,van);for(const a of[-1.3,1.3])for(const b of[-.9,.9])box(.7,.7,.3,0x111111,a,.35,b,van);van.position.set(-30,.12,RZ+1.9);sc.add(van);
const moto=new THREE.Group();box(1.8,.4,.5,0xb0352a,0,.7,0,moto);box(.4,.8,.4,0x222222,0,1.2,0,moto);box(.3,.3,.3,0xf0f0f0,0,1.75,0,moto);for(const a of[-.75,.75])box(.2,.7,.7,0x111111,a,.35,0,moto);moto.rotation.y=Math.PI;moto.position.set(30,.12,RZ-1.9);sc.add(moto);

// ---------- CAVO ELETTRICO PERICOLOSO ----------
const cp=[[530,490,3.8],[560,520,3.4],[595,535,3],[630,545,2.8],[655,530,2.5],[690,545,2],[712,525,1.6],[716,560,.9],[718,595,.3]].map(([x,y,h])=>{const [a,b]=P(x,y);return new THREE.Vector3(a,h,b)});
const curve=new THREE.CatmullRomCurve3(cp);sc.add(new THREE.Mesh(new THREE.TubeGeometry(curve,60,.08,6),new THREE.MeshBasicMaterial({color:0x151515})));
const tip=cp[8].clone();tip.y=.3;box(.18,.18,.4,0xff9a3c,tip.x,.25,tip.z,sc,false);
const gt=tex(64,64,(g,s)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(160,220,255,.7)');gr.addColorStop(1,'rgba(80,160,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s)});gt.magFilter=THREE.LinearFilter;
const glow=(c,sz)=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,color:c,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));s.scale.set(sz,sz,1);sc.add(s);return s};
const tg=glow(0x9fdcff,3.4);tg.position.copy(tip);tg.position.y=.5;
const pulses=[];for(let i=0;i<7;i++){const s=glow(0xbfe8ff,.8);pulses.push({s,t:i/7})}
const pl=new THREE.PointLight(0x7fd0ff,3,16);pl.position.set(tip.x,1.2,tip.z);sc.add(pl);
const ring=new THREE.Mesh(flat(new THREE.RingGeometry(2.4,2.8,40)),new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true}));ring.position.set(tip.x,.22,tip.z);sc.add(ring);
const arcs=[];for(let i=0;i<4;i++){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(14*3),3));const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xd8f4ff}));l.frustumCulled=false;sc.add(l);arcs.push(l)}
function arc(l,A,B){const a=l.geometry.attributes.position;for(let k=0;k<14;k++){const t=k/13,e=k>0&&k<13?1:0;a.setXYZ(k,A.x+(B.x-A.x)*t+(R()-.5)*.7*e,A.y+(B.y-A.y)*t+Math.sin(Math.PI*t)*.5+(R()-.5)*.6*e,A.z+(B.z-A.z)*t+(R()-.5)*.7*e)}a.needsUpdate=true}
const SN=40,spk=new THREE.BufferGeometry(),sPos=new Float32Array(SN*3),sV=[];for(let i=0;i<SN;i++){sV.push(new THREE.Vector3());sPos[i*3+1]=-9}
spk.setAttribute('position',new THREE.BufferAttribute(sPos,3));sc.add(Object.assign(new THREE.Points(spk,new THREE.PointsMaterial({color:0xffe28a,size:.28,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false})),{frustumCulled:false}));

// ---------- etichette ----------
const labs=[];
function label(t,x,y,z,warn){const c=document.createElement('canvas'),g=c.getContext('2d');g.font='bold 34px ui-monospace,Menlo,monospace';const w=Math.ceil(g.measureText(t).width)+36;c.width=w;c.height=60;g.font='bold 34px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';
 if(warn){g.fillStyle='#ffd54f';g.fillRect(0,0,w,60);g.strokeStyle='#d32f2f';g.lineWidth=8;g.strokeRect(0,0,w,60);g.fillStyle='#1b1b1b';g.fillText(t,w/2,32)}else{g.lineWidth=8;g.strokeStyle='#14161e';g.strokeText(t,w/2,32);g.fillStyle='#fff';g.fillText(t,w/2,32)}
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(w*.022,1.32,1);s.position.set(x,y,z);s.renderOrder=9;sc.add(s);if(!warn)labs.push(s);return s}
