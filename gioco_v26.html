<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Bilocale Deathmatch</title>
<style>
  html,body{margin:0;height:100%;background:#9ec3de;overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#fff}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;pointer-events:none;flex-wrap:wrap}
  #hud.many{gap:4px;padding-top:4px} #hud.many .p{padding:3px 6px;font-size:11px;min-width:0;border-width:2px} #hud.many .p small{font-size:9px}
  .p{padding:6px 10px;background:rgba(20,28,48,.84);border:3px solid;border-radius:6px;font-size:13px;font-weight:700;min-width:88px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .p.off{opacity:.35}
  .p small{display:block;opacity:.7;font-size:10px;font-weight:400}
  #msg{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:clamp(24px,6vw,56px);font-weight:900;text-shadow:3px 3px 0 #1c2438;pointer-events:none}
  #menu{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 30%,rgba(40,52,88,.97),rgba(14,18,32,.98));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:16px;overflow:auto;text-align:center}
  #menu>:first-child{margin-top:auto} #menu>:last-child{margin-bottom:auto}   /* centrato, ma scorrevole se il contenuto e' piu' alto della finestra */
  #menu h1{margin:0;font-size:clamp(22px,5vw,44px);letter-spacing:3px}
  #menu h2{margin:0;font-size:18px}
  #menu .row,#menu .grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
  .btn,.card{font:inherit;color:#fff;background:#2b3556;border:3px solid #5c6bc0;border-radius:6px;padding:10px 16px;cursor:pointer}
  .btn:hover,.card:hover:not(:disabled){background:#3949ab}
  .card{width:200px;display:flex;flex-direction:column;gap:4px;text-align:left}
  .card span{font-size:11px;opacity:.85} .card small{font-size:10px;color:#ffd54f}
  .card:disabled{opacity:.3;cursor:not-allowed}
  .card.map{width:300px}
  .card.map canvas{width:100%;height:auto;border-radius:4px;margin-top:6px;border:2px solid #1c2438}
  #help{position:fixed;bottom:0;left:0;right:0;font-size:11px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(20,28,48,.85);pointer-events:none;display:flex;justify-content:space-between;gap:8px}
  #help b{font-size:16px;letter-spacing:2px}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 58%,rgba(8,10,24,.38) 100%)}
  #menu .card.mode{width:340px;padding:16px 18px}
  #menu .card.mode b{font-size:18px}
  .sub{font-size:12px;opacity:.75}
  .res{background:rgba(20,28,48,.88);border:3px solid #5c6bc0;border-radius:8px;padding:10px 12px;max-width:min(980px,100%);box-sizing:border-box;text-align:left}
  .resh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px} .resh b{font-size:18px}
  .tw{overflow-x:auto} .res table{border-collapse:collapse;font-size:12px;width:100%}
  .res th,.res td{padding:5px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap}
  .res th{font-size:10px;opacity:.7;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
  .res td:first-child,.res th:first-child{text-align:left} .res tr.win td{color:#ffd54f} .res i{font-size:10px;opacity:.85}
  .card.rnd{border-style:dashed;justify-content:center;align-items:center;text-align:center} .card.rnd b{font-size:20px}
  #banner{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:5px 14px;background:rgba(20,28,48,.85);border:2px solid #5c6bc0;border-radius:6px;font-size:14px;font-weight:700;pointer-events:none;display:none;white-space:nowrap}
  #banner.low{top:auto;bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  #feed{position:fixed;top:calc(104px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;font-size:12px}
  .fe{background:rgba(20,28,48,.82);padding:4px 9px;border-radius:5px;transition:opacity .6s}
  #pause{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,14,28,.6);pointer-events:none}
  #pause b{font-size:clamp(32px,7vw,64px);letter-spacing:6px} #pause span{opacity:.85}
  #pause .pbtn{display:flex;gap:12px;pointer-events:auto} #pause .pbtn .btn{font-size:18px;padding:12px 22px}
  /* ---- modalita' mobile: joystick sullo schermo (stile Brawl Stars) ---- */
  html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #touch{position:fixed;inset:0;z-index:3;display:none;touch-action:none}
  body.mobile #touch{display:block} body.mobile #help{display:none} body.mobile #pause .pk{display:none}
  .stick{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);pointer-events:none;opacity:.55;transition:opacity .15s}
  .stick.on{opacity:1} .stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .stick em{position:absolute;left:0;right:0;top:100%;margin-top:6px;text-align:center;font:700 10px ui-monospace,monospace;font-style:normal;letter-spacing:1px;opacity:.8;text-shadow:0 1px 2px #000}
  .stick.on em{display:none}
  #stR{border-color:rgba(255,196,64,.7)} #stR i{background:rgba(255,186,48,.8)}
  #tPause{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(10,14,28,.55);color:#fff;font:700 16px sans-serif}
  #tHint{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:10px;opacity:.7;text-shadow:0 1px 2px #000;pointer-events:none}
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,28,.92);font-size:18px;text-align:center;padding:20px}
  #rotate b{font-size:64px}
  #netPanel{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:6;display:none;background:rgba(14,18,32,.88);border:2px solid #5c6bc0;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5;pointer-events:none;max-width:320px}
  #netPanel b{font-size:22px;letter-spacing:4px;color:#ffd54f} #netPanel.small{opacity:.75;padding:4px 8px} #netPanel.small b{font-size:14px;letter-spacing:2px}
  .netcode{font:700 28px ui-monospace,monospace;letter-spacing:8px;text-transform:uppercase;width:5.2em;text-align:center;padding:8px;border-radius:8px;border:3px solid #5c6bc0;background:#1c2438;color:#ffd54f}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px} .chip{font:inherit;font-size:12px;color:#fff;background:#2b3556;border:2px solid #5c6bc0;border-radius:16px;padding:6px 10px;cursor:pointer}
  .chip.on{background:#3949ab;border-color:#ffd54f} .netst{font-size:14px;text-align:center;max-width:640px}
  body.netc #hud .p.off{display:none} body.netc #help{display:none}
  @media (orientation:portrait){ body.mobile #rotate{display:flex} }
  /* telefono: interfaccia ridotta al minimo, cosi' si vede la partita */
  body.mobile #hud{gap:4px;padding:calc(4px + env(safe-area-inset-top,0px)) 60px 0 calc(6px + env(safe-area-inset-left,0px));justify-content:flex-start}
  body.mobile #hud .p{padding:2px 7px;font-size:11px;min-width:0;border-width:2px;background:rgba(20,28,48,.6);box-shadow:none}
  body.mobile #hud .p small{display:none}
  body.mobile #banner{top:calc(30px + env(safe-area-inset-top,0px));left:auto;right:calc(62px + env(safe-area-inset-right,0px));transform:none;font-size:11px;padding:2px 8px;border-width:1px;background:rgba(20,28,48,.6)}
  body.mobile #feed{top:calc(52px + env(safe-area-inset-top,0px));right:calc(62px + env(safe-area-inset-right,0px));font-size:10px;gap:2px}
  body.mobile #feed .fe{padding:2px 6px;background:rgba(20,28,48,.55)} body.mobile #feed .fe:nth-child(n+3){display:none}
  body.mobile #msg{top:22%;font-size:clamp(16px,4.2vw,30px);text-shadow:2px 2px 0 #1c2438}
  body.mobile .stick{width:104px;height:104px;margin:-52px 0 0 -52px;opacity:.28;border-width:1.5px} body.mobile .stick.on{opacity:.85}
  body.mobile .stick i{width:44px;height:44px;margin:-22px} body.mobile .stick em{display:none}
  body.mobile #tPause{top:calc(4px + env(safe-area-inset-top,0px));width:38px;height:34px;border-radius:9px;font-size:13px;background:rgba(10,14,28,.4);border-width:1px}
  body.mobile #tHint{display:none}
  /* menu piu' compatto sugli schermi bassi (telefono in orizzontale) */
  @media (max-height:520px){ #menu{gap:8px !important;padding:8px !important} #menu h1{font-size:22px} #menu h2{font-size:14px}
    #menu .card.mode{width:260px;padding:10px 12px} #menu .card.mode b{font-size:15px} .card{width:150px;padding:6px 10px} .card.map{width:220px} .btn{padding:8px 12px} }
  .setg{display:grid;grid-template-columns:auto auto;gap:10px 16px;align-items:center;text-align:left;max-width:680px}
  .seg{display:flex;flex-wrap:wrap;gap:6px} .seg .btn{padding:6px 12px} .btn.on{background:#3949ab;border-color:#ffd54f}
  .recl{padding:3px 0;font-size:13px}
  .card canvas.mini{width:100%;height:118px;border-radius:5px;margin-bottom:4px;background:radial-gradient(ellipse at 50% 70%,#46558c,#1c2438 75%)}
  .card:disabled canvas.mini{filter:grayscale(1)}
  @media (max-height:520px){ .card canvas.mini{height:80px} }
  .qm{font-size:64px;font-weight:900;text-align:center;padding:18px 0;border:2px dashed #5c6bc0;border-radius:4px;margin-top:6px;opacity:.8}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hud"></div>
<div id="msg"></div>
<div id="banner"></div>
<div id="feed"></div>
<div id="pause"><b>PAUSA</b><span class="pk">Esc o P per riprendere · R per tornare al menu</span><div class="pbtn"><button class="btn" id="pResume">▶ Riprendi</button><button class="btn" id="pMenu">⌂ Menu</button></div></div>
<div id="touch"><div class="stick" id="stL"><i></i><em>MUOVI</em></div><div class="stick" id="stR"><i></i><em>MIRA · SPARA</em></div><button id="tPause" aria-label="Pausa">❚❚</button><div id="tHint">Tocco veloce a destra = mira automatica</div></div>
<div id="rotate"><b>↻</b>Gira il telefono in orizzontale</div>
<div id="netPanel"></div>
<div id="menu"></div>
<div id="help"><b>BILOCALE</b><span>Sparo: Q / Invio / U / Numpad0 · Pad: stick + A/RT · Esc: pausa · R: menu · G: grafica <span id="qlab">AUTO</span></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Gestione colore: i colori esadecimali (sRGB) vengono convertiti in lineare per un rendering realistico
(()=>{const sh=THREE.Color.prototype.setHex;THREE.Color.prototype.setHex=function(h){sh.call(this,h);return this.convertSRGBToLinear();};})();

// ================= RETE (LAN): stato condiviso =================
// nel file server.html NET_ROLE vale 'host' (apre la stanza e fa girare la partita); nel gioco normale 'client' (puo' collegarsi)
const NET_ROLE='client';
const NET={host:false,client:false,view:false,allow:false,ev:null,rin:Array(8).fill(null),slot:-1,code:'',conns:new Map(),peer:null,conn:null,idc:0,acc:0,iacc:0,tapN:0,lastDom:{},dom:{},resHTML:'',myChar:-1,status:''};
const NETON=()=>NET.client&&NET.view;          // il client sta mostrando la partita dell'host: niente logica di gioco in locale
const COOP=()=>MODE==='survival'||MODE==='tower';   // modalita' in cui i giocatori combattono insieme
const r2=v=>Math.round(v*100)/100;
function netEv(...a){ if(NET.ev) NET.ev.push(a); }

// ================= CONFIG =================
let W = 30, H = 20;   // 30m x 20m, 1 cella = 1m (le mappe giganti sono piu' grandi: vedi MAPS[k].size)
const WALL_H = 1.5, SPEED = 5;
const KEYS = [
  {name:'WASD+Q',      up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD', fire:'KeyQ'},
  {name:'Frecce+Invio', up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight', fire:'Enter'},
  {name:'IJKL+U',       up:'KeyI', down:'KeyK', left:'KeyJ', right:'KeyL', fire:'KeyU'},
  {name:'Num 8456+0',   up:'Numpad8', down:'Numpad5', left:'Numpad4', right:'Numpad6', fire:'Numpad0'},
  {name:'Pad 5 / rete'},{name:'Pad 6 / rete'},{name:'Pad 7 / rete'},{name:'Pad 8 / rete'},   // dal 5 in su: solo pad o telefono collegato
];
const SSJ_DMG = 150, SSJ_TIME = 18;   // super sayan: dopo 150 danni causati, 18s, +20% velocita e danno
const LIVES = 4;   // vite a testa: dopo 4 morti sei eliminato
const TEAMC=[0xff5252,0x448aff], TEAMN=['ROSSA','BLU']; let teamMode=false, MODE='ffa';   // deathmatch a squadre 2v2
const WCOL = {burst:0x263238,arrow:0xff6d00,saetta:0xfff27a,panz:0xd9953a,tyre:0x17181b,bowl:0x43a047,shoe:0xc8f020,shofar:0xd7b98e,punch:0xe8b890,spray:0x7cb342,postit:0xffeb3b,melon:0x2e7d32,mug:0xffc107,zucchini:0x66bb6a,foot:0xffcc80,axe:0x9e9e9e,trident:0x00bcd4,drum:0x8d5a2b,clone:0xd32f2f,flame:0xff6d00,snake:0xab47bc,cloud:0x78909c,nose:0xffcc80,pistol:0x263238,katana:0x263238,table:0x8d5a3b,chair:0xa86a3c,bazooka:0x558b2f,goku:0x4fc3f7,toilet:0xffffff};
const COLORS = Array(8).fill(0xf4f7ff);
let SPAWNS = [[3.5,8.5],[23.5,6.5],[6.5,14.5],[16.5,11.5]];
let CX=W/2, CZ=H/2;

// ================= UTILITA =================
const css=c=>'#'+(c&0xffffff).toString(16).padStart(6,'0');
const shade=(c,f)=>{const r=Math.min(255,(c>>16&255)*f)|0,g=Math.min(255,(c>>8&255)*f)|0,b=Math.min(255,(c&255)*f)|0;return (r<<16)|(g<<8)|b;};
const hash=(a,b=0,c=0)=>{let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;};
const bgColor=hex=>new THREE.Color().setRGB((hex>>16&255)/255,(hex>>8&255)/255,(hex&255)/255);

// ================= SCENA / RENDERER REALISTICO =================
const DPR=window.devicePixelRatio||1;
// su schermi ad alta densita' l'MSAA costa molto e serve poco: lo attiviamo solo a densita' normale
const renderer = new THREE.WebGLRenderer({antialias:DPR<1.5,powerPreference:'high-performance',stencil:false});
renderer.setPixelRatio(Math.min(DPR,1.5));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
scene.background = bgColor(0x9ec3de);
const hemiL=new THREE.HemisphereLight(0xffffff,0x888888,.8); scene.add(hemiL);
const sunL=new THREE.DirectionalLight(0xffffff,1.1); sunL.castShadow=true; sunL.shadow.mapSize.set(2048,2048);
{const s=sunL.shadow.camera; s.left=-21; s.right=21; s.top=21; s.bottom=-21; s.near=1; s.far=80;}   // frustum stretto sulla mappa = ombre piu' nitide
sunL.shadow.bias=-.0004; sunL.shadow.normalBias=.03; sunL.shadow.radius=3; scene.add(sunL,sunL.target);
const fillL=new THREE.DirectionalLight(0xffffff,.35); fillL.position.set(CX,15,CZ+25); scene.add(fillL);

const cam = new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
cam.position.set(CX,28,CZ+16.5); cam.lookAt(CX,0,CZ);
const VIEW={cx:CX,cz:CZ,hh:12,hw:18.5};
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h;
  renderer.setSize(Math.ceil(w),Math.ceil(h),false);
  let hh=VIEW.hh,hw=hh*a; if(hw<VIEW.hw){hw=VIEW.hw;hh=hw/a;}
  cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix();
  cam.position.set(VIEW.cx,28,VIEW.cz+16.5); cam.lookAt(VIEW.cx,0,VIEW.cz);
}
function setView(cx=CX,cz=CZ,hh=12*H/20,hw=18.5*W/30){ Object.assign(VIEW,{cx,cz,hh,hw}); resize(); }
addEventListener('resize',resize); resize();

// ================= QUALITA' GRAFICA (adattiva) =================
// ALTA: risoluzione piena + ombre 2048 · MEDIA: risoluzione ridotta + ombre 1024 · BASSA: niente ombre in tempo reale (restano le ombre a disco)
const QUAL=[{n:'BASSA',pr:Math.min(DPR,1)*.8,sh:0},{n:'MEDIA',pr:Math.min(DPR,1.15),sh:1024},{n:'ALTA',pr:Math.min(DPR,1.75),sh:2048}];
let qLevel=2,qAuto=true;
const fpsMon={acc:0,n:0,low:0};
function setQuality(l){
  qLevel=Math.max(0,Math.min(2,l)); const Q=QUAL[qLevel], want=Q.sh>0;
  renderer.setPixelRatio(Q.pr); resize();
  if(sunL.shadow.map){sunL.shadow.map.dispose();sunL.shadow.map=null;}
  if(want) sunL.shadow.mapSize.set(Q.sh,Q.sh);
  if(renderer.shadowMap.enabled!==want){renderer.shadowMap.enabled=want;sunL.castShadow=want;
    scene.traverse(o=>{if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);});}
  if(typeof BLOB_MAT!=='undefined') BLOB_MAT.opacity=want?.32:.5;
  const el=document.getElementById('qlab'); if(el) el.textContent=(qAuto?'AUTO · ':'')+Q.n;
}
// misura gli fps e abbassa la qualita' da sola se il pc fatica
function watchFps(rawDt){
  if(!qAuto||rawDt>1||document.hidden) return;   // >1 s = scheda in background, non lag
  fpsMon.acc+=rawDt; fpsMon.n++;
  if(fpsMon.acc>=1.5){const fps=fpsMon.n/fpsMon.acc; fpsMon.acc=0; fpsMon.n=0;
    if(fps<42){ if(++fpsMon.low>=2&&qLevel>0){fpsMon.low=0;setQuality(qLevel-1);} } else fpsMon.low=0;}
}
addEventListener('keydown',e=>{ if(e.code!=='KeyG'||e.repeat) return;
  if(qAuto){qAuto=false;setQuality(2);} else if(qLevel>0) setQuality(qLevel-1); else {qAuto=true;setQuality(2);} });

// ================= AUDIO: effetti sonori sintetizzati (nessun file esterno) =================
const SFX=(()=>{
  let ac=null,master=null,nb=null,vol=.5; const last={};
  const GAP={splat:80,charge:150,hit:70,flame:110,spray:110,stomp:90,bounce:90,boom:70,pew:40,step:120};
  function unlock(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=vol;
        const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);}catch(e){ ac=null; return; } }
    if(ac.state==='suspended') ac.resume(); }
  const noiseBuf=()=>{ if(nb) return nb; nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nb; };
  const env=(g,t,a,d,pk)=>{ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); };
  function tone(type,f0,f1,dur,pk=.25,dl=0,a=.005,dst){ const t=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain(); o.type=type;

// ================= COSTRUZIONE MAPPA =================
let grid,obs,mapKey='',mapGroup=null,seaT=null,bobbers=[],SPOTS=[],mapHook=null;
const animFns=[],waveFlags=[],fadeCrowns=[];   // animazioni di scenario della mappa corrente
// 'X' = acqua/melma/catrame: non ci si cammina, ma i proiettili ci passano sopra
const solid=(i,j)=>!grid[j]?.[i]||grid[j][i]==='X'||obs[j][i];
const projBlock=(i,j)=>!grid[j]?.[i]||obs[j][i];
function collides(x,z,RADIUS,noObs){
  for(let j=Math.floor(z-RADIUS);j<=Math.floor(z+RADIUS);j++)
    for(let i=Math.floor(x-RADIUS);i<=Math.floor(x+RADIUS);i++){
      if(noObs?(grid[j]?.[i]&&grid[j][i]!=='X'):!solid(i,j)) continue;
      const nx=Math.max(i,Math.min(x,i+1)), nz=Math.max(j,Math.min(z,j+1));
      if((x-nx)**2+(z-nz)**2<RADIUS*RADIUS) return true;
    }
  return false;
}
// ---- SPAWN CASUALI: si nasce in un punto libero a caso, lontano dai nemici (nel 2v2 dal proprio lato della mappa) ----
function spawnSpot(p,taken=[]){
  const M=MAPS[mapKey], base=SPAWNS[p.sp%SPAWNS.length]||[CX,CZ];
  let pool=SPOTS.filter(([x,z])=>!(M&&M.spawnOk&&!M.spawnOk(x,z)));
  if(!pool.length) return base.slice();
  if(teamMode){ const near=pool.filter(([x,z])=>Math.hypot(x-base[0],z-base[1])<Math.max(5,Math.min(W,H)*.28)); if(near.length>=4) pool=near; }
  if(MODE==='tower'&&TD.core){ const near=pool.filter(([x,z])=>{const d=Math.hypot(x-TD.core.x,z-TD.core.z);return d>2.2&&d<6.5;}); if(near.length>=3) pool=near; }
  const foes=players.filter(q=>q!==p&&q.active&&!q.dead&&!COOP()&&!(teamMode&&q.team===p.team));
  const haz=[...minions.filter(m=>!m.dead&&!m.ally),...(busEvent?[busEvent]:[])];
  let best=null,bs=-1e9;
  for(let k=0;k<48;k++){ const c=pool[Math.random()*pool.length|0]; let sc=Math.random()*3;
    if(foes.length) sc+=Math.min(12,Math.min(...foes.map(q=>Math.hypot(q.x-c[0],q.z-c[1]))));
    if(taken.length) sc+=Math.min(8,Math.min(...taken.map(t=>Math.hypot(t[0]-c[0],t[1]-c[1]))))*1.5;
    if(haz.length) sc+=Math.min(6,Math.min(...haz.map(h=>Math.hypot(h.x-c[0],h.z-c[1]))))*1.2;
    if(sc>bs){bs=sc;best=c;} }
  return best.slice();
}
function computeSpots(){
  SPOTS=[];
  for(let j=1;j<H-1;j++)for(let i=1;i<W-1;i++){let ok=true;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++)if(solid(i+di,j+dj))ok=false;if(ok)SPOTS.push([i+.5,j+.5]);}
}
// pavimenti dipinti su un unico canvas (parquet, piastrelle, pietra, piazza)
function paintWood(g,px,py,S,i,j){
  const ph=S/4;
  for(let k=0;k<4;k++){
    const y0=py+k*ph,row=j*4+k,off=Math.floor(hash(row,7)*S*2);
    for(let x=0;x<S;x+=8){const idx=Math.floor((px+x+off)/(S*2)),hv=hash(idx,row,3);g.fillStyle=`hsl(${26+hv*5},${48+hv*10}%,${50+hv*10}%)`;g.fillRect(px+x,y0,8,ph);}
    g.fillStyle='rgba(80,40,15,.13)';for(let n=0;n<3;n++)g.fillRect(px+Math.random()*S,y0+Math.random()*ph,10+Math.random()*20,1);
    g.fillStyle='rgba(50,25,10,.55)';g.fillRect(px,y0+ph-1,S,1);
    for(let x=0;x<S;x++){if(Math.floor(px+x+off)%(S*2)===0)g.fillRect(px+x,y0,1.5,ph);}
  }
}
function paintTile(g,px,py,S,i,j){
  const ts=S/2;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){const hv=hash(i*2+a,j*2+b,5);g.fillStyle=`hsl(200,12%,${86+hv*7}%)`;g.fillRect(px+a*ts,py+b*ts,ts,ts);
    g.fillStyle='rgba(120,135,145,.9)';g.fillRect(px+a*ts,py+b*ts,ts,2);g.fillRect(px+a*ts,py+b*ts,2,ts);
    g.fillStyle='rgba(255,255,255,.2)';g.fillRect(px+a*ts+4,py+b*ts+4,ts*.45,2);}
}
function paintStone(g,px,py,S,i,j){
  let y=0,row=0;
  while(y<S){const hg=[20,22,18,24][Math.floor(hash(i,j,row)*4)],hh=Math.min(hg,S-y);
    let x=-Math.floor(hash(i,j,row+9)*20),n=0;
    while(x<S){const w=[26,30,34,22][Math.floor(hash(i,j,row*7+n)*4)],x0=Math.max(0,x),x1=Math.min(S,x+w),hv=hash(i,j,row*13+n+50);
      g.fillStyle=`hsl(38,${12+hv*8}%,${70+hv*12}%)`;g.fillRect(px+x0,py+y,x1-x0,hh);
      g.fillStyle='rgba(95,88,75,.7)';if(x>0)g.fillRect(px+x,py+y,1.6,hh);if(y>0)g.fillRect(px+x0,py+y,x1-x0,1.6);
      x+=w;n++;}
    y+=hg;row++;}
}
function paintPlaza(g,px,py,S,i,j){
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){const r=j*2+b,off=(r%2)*32,gx0=(i*2+a)*32,idx=Math.floor((gx0+off)/64),hv=hash(idx,r,11);
    g.fillStyle=`hsl(40,${22+hv*10}%,${80+hv*7}%)`;g.fillRect(px+a*32,py+b*32,32,32);
    g.fillStyle='rgba(120,105,85,.6)';g.fillRect(px+a*32,py+b*32+30,32,2);if((gx0+off)%64===0)g.fillRect(px+a*32,py+b*32,2,32);}
}
function paintRug(g,S,x,y,w,h,c){
  const px=x*S,py=y*S,pw=w*S,ph=h*S;
  g.save();g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=6;g.fillStyle=css(shade(c,.8));g.fillRect(px+4,py+4,pw-8,ph-8);g.restore();
  g.fillStyle=css(c);g.fillRect(px+10,py+10,pw-20,ph-20);
  g.strokeStyle=css(shade(c,1.4));g.lineWidth=3;g.strokeRect(px+18,py+18,pw-36,ph-36);
  g.fillStyle='rgba(255,255,255,.12)';
  for(let a=px+32;a<px+pw-32;a+=24)for(let b=py+32;b<py+ph-32;b+=24){g.beginPath();g.moveTo(a,b-6);g.lineTo(a+6,b);g.lineTo(a,b+6);g.lineTo(a-6,b);g.fill();}
  g.strokeStyle='rgba(255,240,210,.8)';g.lineWidth=1;
  for(let a=px+6;a<px+pw-6;a+=5){g.beginPath();g.moveTo(a,py+4);g.lineTo(a,py-1);g.moveTo(a,py+ph-4);g.lineTo(a,py+ph+1);g.stroke();}
}
// ---- pavimenti delle nuove mappe ----
function paintDirt(g,px,py,S,i,j){g.fillStyle=`hsl(${33+hash(i,j,21)*4},${34+hash(i,j,22)*5}%,${54+hash(i,j,23)*4}%)`;g.fillRect(px,py,S,S);
  for(let k=0;k<7;k++){const a=hash(i,j,k+30),b=hash(i,j,k+60);g.fillStyle=`rgba(95,72,48,${.2+a*.3})`;g.beginPath();g.ellipse(px+a*S,py+b*S,2+a*3,1.5+b*2,0,0,7);g.fill();}
  if(hash(i,j,99)<.35){g.fillStyle='rgba(105,150,60,.75)';for(let k=0;k<7;k++)g.fillRect(px+hash(i,j,k+90)*S,py+hash(i,j,k+120)*S,2,5);}}
function paintLane(g,px,py,S,i,j,d){g.fillStyle=`hsl(22,${30+hash(i,j,5)*6}%,${35+hash(i,j,6)*4}%)`;g.fillRect(px,py,S,S);
  g.fillStyle='rgba(60,35,20,.35)';for(let k=0;k<5;k++)g.fillRect(px+hash(i,j,k)*S,py+hash(i,j,k+9)*S,6+hash(i,j,k+3)*10,2);
  // bordo a strisce giallo/nere verso le zone sicure: si vede subito dove passa il T-rex
  const safe=(ii,jj)=>{const t=d.grid[jj]?.[ii];return t&&t!=='L';};
  const st=(x0,y0,hz)=>{for(let k=0;k<6;k++){g.fillStyle=k%2?'#f2c230':'#2a1d14';hz?g.fillRect(px+x0+k*S/6,py+y0,S/6+.5,6):g.fillRect(px+x0,py+y0+k*S/6,6,S/6+.5);}};
  if(safe(i,j-1))st(0,0,1); if(safe(i,j+1))st(0,S-6,1); if(safe(i-1,j))st(0,0,0); if(safe(i+1,j))st(S-6,0,0);}
function stonePost(g,S){
  const print=(x,y,ang)=>{g.save();g.translate(x*S,y*S);g.rotate(ang);g.fillStyle='rgba(45,25,12,.55)';g.beginPath();g.ellipse(0,0,S*.14,S*.18,0,0,7);g.fill();

const PCH_PX=([x,y])=>[(x-237)/23.3,(y-270)/19.8];       // pixel dello schizzo -> caselle

function parchData(){
  const G=[],C=[];
  for(let j=0;j<H;j++){G.push([]);C.push([]);for(let i=0;i<W;i++){let t,c='';
    if(i>=PCH_ROAD[0]&&i<=PCH_ROAD[1]) t='R'; else if(i===PCH_ROAD[0]-1||i===PCH_ROAD[1]+1) t='M';
    else if(i===0||j===0||i===W-1||j===H-1){t=null;c='H';}
    else t=pchIn(i+.5,j+.5,PCH_OUT)?'VL':'CB';
    G[j].push(t);C[j].push(c);}}
  const P=PCH_PITCH;
  for(let j=P.j0;j<=P.j1;j++)for(let i=P.i0;i<=P.i1;i++){const edge=i===P.i0||i===P.i1||j===P.j0||j===P.j1;
    const gap=(j===P.j0||j===P.j1)&&(i===11||i===12)||(i===P.i0||i===P.i1)&&(j===P.j0+1||j===P.j1-1);   // 6 varchi nella recinzione
    if(edge&&!gap){G[j][i]=null;C[j][i]='f';} else G[j][i]=edge?'VL':'PO';}
  const K=PCH_COURT; for(let j=K.j0;j<=K.j1;j++)for(let i=K.i0;i<=K.i1;i++) G[j][i]='PO';
  for(let j=15;j<=17;j++)for(let i=17;i<=21;i++) G[j][i]='I';        // sabbia dell'altalena
  for(let j=11;j<=14;j++)for(let i=19;i<=21;i++) G[j][i]='I';        // sabbia dello scivolo
  for(let j=0;j<H;j++)for(let i=0;i<W;i++) if(G[j][i]&&pchIn(i+.5,j+.5,PCH_POND)) G[j][i]='X';
  for(const [x,y,w,h] of PCH_HEDGE) for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){G[j][i]=null;C[j][i]='h';}
  PCH_GRID=G;
  return {grid:G,furn:FURN_PARCH,decor:[],door:new Set(),ch:(i,j)=>(C[j]&&C[j][i])||'H',xc:'#1f86bf',paintX:paintWater,post:parchPost,
    wallFloor:(g,px,py,S,i,j)=>(pchIn(i+.5,j+.5,PCH_OUT)?paintLawn:paintCobble)(g,px,py,S,i,j)};
}
function paintCobble(g,px,py,S,i,j){g.fillStyle='#9d9486';g.fillRect(px,py,S,S);
  for(let k=0;k<16;k++){const a=hash(i,j,k),b=hash(i,j,k+40);g.fillStyle=`hsl(35,${8+hash(i,j,k+80)*10}%,${52+hash(i,j,k+120)*20}%)`;g.beginPath();g.ellipse(px+(k%4+.5)*S/4+(a-.5)*5,py+((k>>2)+.5)*S/4+(b-.5)*5,6+a*2,5+b*2,a*3,0,7);g.fill();}}
function paintClay(g,px,py,S,i,j){g.fillStyle=`hsl(${20+hash(i,j,1)*4},72%,${49+hash(i,j,2)*4}%)`;g.fillRect(px,py,S,S);
  for(let k=0;k<6;k++){g.fillStyle=hash(i,j,k+9)<.5?'rgba(255,160,90,.16)':'rgba(140,45,10,.14)';g.beginPath();g.arc(px+hash(i,j,k+20)*S,py+hash(i,j,k+30)*S,5+hash(i,j,k+40)*14,0,7);g.fill();}}

function parchPost(g,S){
  const cells=t=>{for(let j=0;j<H;j++)for(let i=0;i<W;i++){const v=PCH_GRID[j][i];if(v==='VL'||v==='CB')t(i,j);}};

    const nx=this.x+dx*SPEED*this.spd*dt, nz=this.z+dz*SPEED*this.spd*dt;

    if(!collides(this.x,nz,r,g)) this.z=nz;

  }
  // sull'olio: si accelera e si frena pianissimo, come sul ghiaccio; contro i muri si rimbalza un po'

    let [dx,dz]=this.slipIn||[0,0]; this.slipIn=null; const len=Math.hypot(dx,dz); if(len>1){dx/=len;dz/=len;}

    if(!collides(this.x,nz,r,false)) this.z=nz; else this.svz*=-.35;

  }
}

const LAVA_MATS=[]; let lavaTX=null;
function lavaTextures(){
  if(lavaTX) return lavaTX;
  const S=256,cracks=[];let seed=1;const R=()=>hash(seed++,77);
  for(let k=0;k<22;k++){let x=R()*S,y=R()*S,a=R()*6.28;const pts=[[x,y]];for(let i=0;i<11;i++){a+=(R()-.5)*1.3;x+=Math.cos(a)*11;y+=Math.sin(a)*11;pts.push([x,y]);}cracks.push({pts,w:1.5+R()*4});}
  const paint=glow=>ctex(S,g=>{
    if(glow){g.fillStyle='#000';g.fillRect(0,0,S,S);}
    else{g.fillStyle='#3d3633';g.fillRect(0,0,S,S);for(let i=0;i<140;i++){const v=R()<.5?0:150;g.fillStyle=`rgba(${v},${v*.85|0},${v*.8|0},${.08+R()*.15})`;g.beginPath();g.arc(R()*S,R()*S,4+R()*16,0,7);g.fill();}}
    g.lineCap=g.lineJoin='round';
    for(const c of cracks) for(const [col,wm] of (glow?[['#ff3d00',2.4],['#ffab00',1.1],['#fff5c0',.35]]:[['#140e0c',1.8],['#ff5a1a',.8]])){
      g.strokeStyle=col;g.lineWidth=c.w*wm;g.beginPath();c.pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();}
  },2,2);

}

  const bone=M(0xe6e1cf),shade=M(0xcfc9b4),dark=M(0x2a2a2e);
  box(g,2,2,17,0,17,-.5,bone);
  [-5,-3,-1,1,3].forEach(z=>[-1,1].forEach(s=>{box(g,.9,4,.9,s*2.2,14.6,z,bone).rotation.z=s*.18;box(g,.9,3.6,.9,s*3.2,11.6,z,shade).rotation.z=-s*.12;}));
  box(g,1.2,1,12,0,9.8,-2,shade);box(g,5,3,4,0,16,-7.5,bone);box(g,5,4,2.4,0,15.5,5,bone);
  [[-2.2,5.6],[2.2,-7.4],[2.2,5.6],[-2.2,-7.4]].forEach(([x,z])=>{                     // FL, BR, FR, BL
    const lg=new THREE.Group();lg.position.set(x*V,15*V,z*V);g.add(lg);
    box(lg,1.8,5.5,2,0,-2.7,0,bone);box(lg,2.2,2,2.2,0,-5.7,0,shade);box(lg,1.4,4.6,1.4,0,-8.2,0,bone);box(lg,1.8,1.6,1.8,0,-10.8,.1,shade);box(lg,1.2,3.4,1.2,0,-12.8,0,bone);box(lg,2.2,1.4,2.8,0,-14.4,.4,dark);hl.push(lg);});
  for(let i=0;i<6;i++)box(g,1.7,1.7,2.1,0,19+i*1.7,5.8+i*1.3,bone);
  const sk=new THREE.Group();sk.position.set(0,29.2*V,13.2*V);sk.rotation.x=.5;g.add(sk);
  box(sk,3.4,3.4,6.4,0,0,2.2,bone);box(sk,2.6,2,3,0,-.4,5.6,shade);box(sk,2.2,.9,5,0,-2.4,3.4,shade);
  for(let i=0;i<4;i++)box(sk,.5,.8,.5,i%2?.7:-.7,-1.7,4.4+(i>>1)*1.4,M(0xffffff));
  [-1,1].forEach(s=>{box(sk,1,1.4,1,s*1.5,.9,1.4,dark);eyes.push(ball(sk,0x5ff0ff,.55,s*1.5,.9,1.6,true));box(sk,.9,2,.9,s*1.4,2.6,-.2,bone);});
  for(let i=0;i<5;i++)box(g,.9,2.4,.9,0,15.2-i*2,-9.8-i*.5,bone).rotation.x=.1*i;
  box(g,6.4,1,6.4,0,18.5,-.5,M(0x5a3a22));
}

// ================= TRE NUOVI PERSONAGGI: Muzungu, Michele 7 di denari, Piero =================
// ruota/pneumatico: l'asse e' la y locale del gruppo (poi lo si orienta con rotation)
function wheelObj(Rr,Wd){
  const g=new THREE.Group();
  const cyl=(r,w,c,seg)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r*V,r*V,w*V,seg||16),M(c));m.castShadow=true;g.add(m);return m;};
  cyl(Rr,Wd,0x17181b);                                                                        // pneumatico
  for(let k=0;k<20;k++){const a=k*Math.PI/10,t=box(g,.8,Wd+.2,1.6,Math.cos(a)*(Rr-.05),0,Math.sin(a)*(Rr-.05),M(0x0d0d10));t.rotation.y=-a;}   // battistrada
  cyl(Rr*.78,Wd+.4,0x5b616c);                                                                 // cerchio
  cyl(Rr*.5,Wd+.8,0xcfd5df,12);                                                               // mozzo
  [1,-1].forEach(s=>{for(let k=0;k<5;k++){const a=k*Math.PI*2/5;box(g,.9,.5,.9,Math.cos(a)*Rr*.3,s*(Wd/2+.65),Math.sin(a)*Rr*.3,M(0x6b7380));}});   // bulloni
  return g;
}

function readPad(gp){

  const ax=A[0]||0, az=A[1]||0; if(Math.hypot(ax,az)>.2){r.mv=true;r.mx=ax;r.mz=az;}

  for(let r=.25;r<6;r+=.25)for(let a=0;a<12;a++){const x=p.x+Math.cos(a/12*Math.PI*2)*r,z=p.z+Math.sin(a/12*Math.PI*2)*r;if(!collides(x,z,p.rad)){p.x=x;p.z=z;return;}}

    if(dead){ if(s.end) s.end(b); scene.remove(b.mesh); projectiles.splice(i,1); if(s.gone) s.gone(b); }
  }
}

const items=[]; let itemTimer=10;

// back=false: la scarpa di Piero sparisce senza tornargli in mano (per esempio quando rinasce con le scarpe nuove)
function removeItem(it,back=true){scene.remove(it.mesh);const k=items.indexOf(it);if(k>=0)items.splice(k,1);
  if(back&&it.own!==undefined&&!NETON()){const o=players[it.own];if(o&&o.active){o.shoes=Math.min(3,(o.shoes||0)+1);hud();}}}
function spawnItem(){
  const w=ITEM_TYPES[Math.random()*ITEM_TYPES.length|0];
  const free=SPOTS.filter(([x,z])=>!items.some(it=>Math.hypot(it.x-x,it.z-z)<3)&&players.every(p=>!p.active||Math.hypot(p.x-x,p.z-z)>3));
  const pool=free.length?free:SPOTS,[x,z]=pool[Math.random()*pool.length|0];
  const gen=items.filter(i=>i.own===undefined); if(gen.length>=(W>30?5:3)) removeItem(gen[0]);
  items.push({w,x,z,...itemMeshAt(w,x,z)}); SFX.play('zone');
  say('Nuovo oggetto: '+(w==='speck'?'SPECK':WEAPONS[w].label),1500);
}
function itemMeshAt(w,x,z){
  const mesh=new THREE.Group(),inner=makeItem(w);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.5,.7,20),new THREE.MeshBasicMaterial({color:w==='shoe'||w==='sole'?0xc8f020:w==='speck'?0x66bb6a:w==='katana'?0xff5252:w==='spray'?0x9ccc65:w==='postit'?0x80deea:0xffd54f,side:THREE.DoubleSide}));

  if(live&&!over&&MODE!=='soccer'){itemTimer-=dt; if(itemTimer<=0){itemTimer=ITEM_EVERY[SET.items];spawnItem();}}

function takeItem(p,it){
  if(it.own!==undefined){ if(p.id!==it.own) return; removeItem(it); SFX.play('pickup'); ringAdd(p.x,p.z,.7,0xc8f020); return; }   // Piero si riprende la scarpa

const SOC={ball:null,score:[0,0],t:180,golden:false,pause:0,last:null,lastT:0};
let BALL_MAT=null;
function ballMesh(){
  if(!BALL_MAT) BALL_MAT=new THREE.MeshStandardMaterial({roughness:.45,map:ctex(128,(g,s)=>{g.fillStyle='#fafafa';g.fillRect(0,0,s,s);g.fillStyle='#151515';
    [[16,20],[64,12],[112,22],[40,64],[88,64],[16,108],[64,116],[112,106]].forEach(([x,y])=>{g.beginPath();for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;g.lineTo(x+Math.cos(a)*11,y+Math.sin(a)*11);}g.fill();});
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;for(let k=0;k<s;k+=24){g.beginPath();g.moveTo(k,0);g.lineTo(k+12,s);g.stroke();}})});
  const m=new THREE.Mesh(sphU,BALL_MAT); m.scale.setScalar(BALL_R); m.castShadow=true; return m;
}
function socKickoff(){
  const B=SOC.ball, [cx,cz]=SG.C; B.x=cx; B.z=cz; B.vx=B.vz=0; B.mesh.position.set(cx,BALL_R,cz); SOC.last=null;
  for(const t of [0,1]){ const ps=players.filter(p=>p.active&&p.team===t), lo=(t?1:-1)*SG.K;
    ps.forEach((p,k)=>{const la=ps.length>1?(k?1.8:-1.8)*(SG.ax==='x'?1.2:1):0;
      if(SG.ax==='z'){p.x=cx+la;p.z=cz+lo;p.angle=t?Math.PI:0;} else {p.x=cx+lo;p.z=cz+la;p.angle=t?-Math.PI/2:Math.PI/2;} p.stunT=0; p.vx=p.vz=0; p.px=p.x; p.pz=p.z;}); }
}
function socStart(){
  Object.assign(SOC,{score:[0,0],t:180,golden:false,pause:0,last:null,lastT:0});
  SG=SOC_GEOM[mapKey]||SOC_GEOM.park; POSTS=[]; for(const g of SG.G) for(const m of SG.M) POSTS.push(SG.ax==='z'?[m,g]:[g,m]);
  SOC.ball={x:SG.C[0],z:SG.C[1],vx:0,vz:0,mesh:ballMesh()}; scene.add(SOC.ball.mesh);
  setView(...SG.view); bannerEl.classList.toggle('low',mapKey==='tony'); socKickoff();   // allo stadio il punteggio va in basso, per non coprire la tribuna
}
function socStop(){ if(SOC.ball){scene.remove(SOC.ball.mesh);SOC.ball=null;} bannerEl.classList.remove('low'); }
function socPush(dx,dz,pw,by){ const B=SOC.ball; if(!B||SOC.pause>0) return; B.vx+=dx*pw; B.vz+=dz*pw; const v=Math.hypot(B.vx,B.vz); if(v>17){B.vx*=17/v;B.vz*=17/v;}
  if(by){SOC.last=by;SOC.lastT=matchT;} }
function socKick(p){
  const B=SOC.ball; if(!B||SOC.pause>0) return false;
  const dx=B.x-p.x,dz=B.z-p.z,d=Math.hypot(dx,dz); if(d>p.hitR+BALL_R+.6) return false;
  const fx=Math.sin(p.angle),fz=Math.cos(p.angle); if(d>.25&&(dx*fx+dz*fz)/d<.15) return false;
  const pw=12.5*(p.rageTimer>0?1.3:1)*(p.ssjT>0?1.15:1); B.vx=fx*pw+p.vx*.4; B.vz=fz*pw+p.vz*.4;
  SOC.last=p; SOC.lastT=matchT; p.cd=.35; p.kick=.5; p.st.kicks++; p.st.touch++; SFX.play('kick'); ringAdd(B.x,B.z,.7,0xffffff); return true;
}
function socGoal(team){
  if(over) return;
  SOC.score[team]++; const L=SOC.last;
  if(L&&L.team===team){L.st.goals++;feed(`⚽ ${pname(L)} segna!`);} else if(L){L.st.own++;feed(`⚽ autogol di ${pname(L)}`);} else feed(`⚽ gol della squadra ${TEAMN[team]}`);
  SFX.play('goal'); shake(.3); fxAdd(SOC.ball.x,SOC.ball.z,1.6,TEAMC[team],.4,.5);
  if(mapKey==='tony'){ TONY.cheer=3; SFX.play('crowd'); }
  if(SOC.score[team]>=5||SOC.golden){ socFinish(); return; }
  say(`⚽ GOL! ROSSI ${SOC.score[0]} – ${SOC.score[1]} BLU`,1900); SOC.pause=2.1;
}
function socFinish(){
  const [a,b]=SOC.score, w=a>b?0:1; SFX.play('whistle');
  endRound(`SQUADRA ${TEAMN[w]} VINCE ${Math.max(a,b)}–${Math.min(a,b)}!`,css(TEAMC[w]),players.filter(p=>p.active&&p.team===w).map(p=>p.id));
}
function socUpdate(dt,live){
  const B=SOC.ball; if(!B||over) return;
  if(SOC.pause>0){ SOC.pause-=dt; B.vx*=.9; B.vz*=.9; if(SOC.pause<=0){socKickoff();startCountdown(1);} }
  else if(live){
    SOC.t-=dt;
    if(SOC.t<=0&&!SOC.golden){ if(SOC.score[0]!==SOC.score[1]){socFinish();return;} SOC.golden=true; SFX.play('whistle'); say('⏱ PAREGGIO: GOLDEN GOAL, chi segna vince!',2400); }
  }
  const px=B.x,pz=B.z,r=BALL_R; let hit=false;
  B.x+=B.vx*dt; B.z+=B.vz*dt; const fr=Math.exp(-1.15*dt); B.vx*=fr; B.vz*=fr;
  // reti laterali delle porte
  { const ln=sLong(B.x,B.z), tp=sLat(px,pz), tn=sLat(B.x,B.z);
    for(const [gl,lo] of [[SG.G[0],1],[SG.G[1],0]]) if(lo?ln<gl:ln>gl) for(const m of SG.M) if((tp<m)!==(tn<m)){ if(SG.ax==='z'){B.x=px;B.vx*=-.55;}else{B.z=pz;B.vz*=-.55;} hit=true; } }
  // pali
  for(const [x,z] of POSTS){const dx=B.x-x,dz=B.z-z,d=Math.hypot(dx,dz)||1e-3;if(d<r+.07){const nx=dx/d,nz=dz/d;B.x=x+nx*(r+.07);B.z=z+nz*(r+.07);const vn=B.vx*nx+B.vz*nz;if(vn<0){B.vx-=1.7*vn*nx;B.vz-=1.7*vn*nz;}hit=true;}}
  // recinzione del campo
  const [FX0,FX1,FZ0,FZ1]=SG.F;
  if(B.x<FX0+r){B.x=FX0+r;B.vx=Math.abs(B.vx)*.72;hit=true;} if(B.x>FX1-r){B.x=FX1-r;B.vx=-Math.abs(B.vx)*.72;hit=true;}
  if(B.z<FZ0+r){B.z=FZ0+r;B.vz=Math.abs(B.vz)*.72;hit=true;} if(B.z>FZ1-r){B.z=FZ1-r;B.vz=-Math.abs(B.vz)*.72;hit=true;}
  if(hit&&Math.hypot(B.vx,B.vz)>1.5) SFX.play('bounce');
  // contatto coi giocatori (dribbling)
  if(SOC.pause<=0) for(const p of players){ if(!p.active||p.dead) continue; const dx=B.x-p.x,dz=B.z-p.z,d=Math.hypot(dx,dz)||1e-3,R=p.hitR+r; if(d>=R) continue;
    const nx=dx/d,nz=dz/d; B.x=p.x+nx*R; B.z=p.z+nz*R; const vn=(B.vx-(p.vx||0))*nx+(B.vz-(p.vz||0))*nz;
    if(vn<0){B.vx-=1.5*vn*nx;B.vz-=1.5*vn*nz;} B.vx+=nx*.5; B.vz+=nz*.5;
    if(SOC.last!==p||matchT-SOC.lastT>.4) p.st.touch++; SOC.last=p; SOC.lastT=matchT; }
  // gol: la palla supera la linea tra i pali
  if(SOC.pause<=0){ const ln=sLong(B.x,B.z), tn=sLat(B.x,B.z), inM=tn>SG.M[0]&&tn<SG.M[1];
    if(ln<SG.G[0]-.25&&inM) socGoal(1); else if(ln>SG.G[1]+.25&&inM) socGoal(0); }
  // rotolamento
  const mv=Math.hypot(B.x-px,B.z-pz); if(mv>1e-4){const ax=new THREE.Vector3(B.z-pz,0,-(B.x-px)).normalize(); B.mesh.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(ax,mv/r));}
  B.mesh.position.set(B.x,r,B.z);
}

const SURV={wave:0,brk:4,queue:[],qT:0,mod:'',moved:false};
function edgeSpot(){
  const act=players.filter(p=>p.active&&!p.dead);
  const ok=([x,z])=>act.every(p=>Math.hypot(p.x-x,p.z-z)>6.5)&&!(MODE==='tower'&&TD.core&&Math.hypot(x-TD.core.x,z-TD.core.z)<9);
  const edge=SPOTS.filter(([x,z])=>(x<5||x>W-5||z<4||z>H-4)&&ok([x,z]));
  if(edge.length) return edge[Math.random()*edge.length|0];
  const far=[...SPOTS].sort((a,b)=>Math.min(...act.map(p=>Math.hypot(p.x-b[0],p.z-b[1])))-Math.min(...act.map(p=>Math.hypot(p.x-a[0],p.z-a[1]))));
  return far[Math.random()*Math.min(far.length,8)|0]||SPOTS[0];
}
// punto qualunque lontano dai giocatori (ondata "pioggia di alieni")
function rainSpot(){ const act=players.filter(p=>p.active&&!p.dead); const ok=SPOTS.filter(([x,z])=>act.every(p=>Math.hypot(p.x-x,p.z-z)>5)); const pool=ok.length?ok:SPOTS; return pool[Math.random()*pool.length|0]; }

function survStop(){ SURV.queue.length=0; SURV.mod=''; }
const waveN=()=>MODE==='tower'?TD.wave:SURV.wave;
function waveQueue(w,np,extra){
  const n=4+w*2+(np-1)*2, brutes=w>=3?Math.floor((w-1)/2):0, spit=w>=2?Math.min(6,Math.floor(w/2)):0, q=[];
  for(let k=0;k<n-brutes-spit;k++)q.push('k'); for(let k=0;k<brutes;k++)q.push('b'); for(let k=0;k<spit;k++)q.push('s');
  if(mapKey==='mola'&&w>=2) for(let k=0;k<Math.min(4,w>>1);k++) q.push('c');   // a Mola arrivano anche le super blatte
  if(extra==='bruti') for(let k=0;k<q.length;k+=2) q[k]='b';
  q.sort(()=>Math.random()-.5); if(w%5===0) q.push('B'); return q;
}
function survNextWave(){
  const w=++SURV.wave, np=players.filter(p=>p.active&&p.lives>0).length;
  SURV.mod=w%5===0?'BOSS':w%3===0?['VELOCE','PIOGGIA DI ALIENI','BRUTI'][(w/3|0)%3]:'';
  SURV.queue=waveQueue(w,np,SURV.mod==='BRUTI'?'bruti':''); SURV.qT=.3;
  if(SURV.queue.includes('c')) spawnItemOf('spray');

}

      if(!frozen){
        if(p.stunT>0) p.stunT-=dt; else p.move(dx,dz,dt);
        if(p.slipT>0){ p.slipT-=dt; if(!(p.stunT>0)) p.slide(dt); }
        p.cd-=dt;
        if(p.burstQ>0){ if(p.stunT>0) p.burstQ=0; else if((p.burstT-=dt)<=0){ p.burstT=.085; p.burstQ--;   // raffica di Luchino: i colpi dopo il primo
          const a=p.angle+(Math.random()-.5)*.07,o=.6*Math.max(1,p.gs*.8); spawn('bullet2',p.x+Math.sin(a)*o,p.z+Math.cos(a)*o,a,p); p.kick=.3; SFX.play('pew'); if(p.st) p.st.shots++; } }
        if(qLevel>1&&p.mv){p.dustT-=dt;if(p.dustT<=0){p.dustT=.22;fxAdd(p.x-Math.sin(p.angle)*.25,p.z-Math.cos(p.angle)*.25,.28*p.gs,0xd7ccc8,.1,.4);}}
        if(p.rageTimer>0){p.rageTimer-=dt; giantUpdate(p,dt); if(p.rageTimer<=0) p.endGiant();}
        if(p.ssjT>0){p.ssjT-=dt; if(p.ssjT<=0){p.ssjT=0;p.dealt=0;hud();}}
        const tapFire=MOBILE&&p.id===0?touchAim(p):NET.host&&NET.isRemote(p.id)?remoteAim(p):padAim(p);
        if((wantFire||tapFire)&&p.cd<=0&&!(p.stunT>0)&&!(MODE==='soccer'&&socKick(p))) shoot(p);
        for(const it of [...items]) if((p.x-it.x)**2+(p.z-it.z)**2<.5) takeItem(p,it);
      }
    } else if(live&&p.active&&p.dead){ p.rt-=dt; if(p.rt<=0) p.respawn(); }
    p.vx=(p.x-p.px)/Math.max(dt,1e-3); p.vz=(p.z-p.pz)/Math.max(dt,1e-3);
    if(p.burnT>0&&p.active&&!p.dead&&!over){p.burnT-=dt;p.bA=(p.bA||0)+dt;p.bP=(p.bP||0)+dt;

  if(!NET.conn||!NET.conn.open||!NET.view) return;

  let mx=0,mz=0,fire=false;
  if(IS_TOUCH){ mx=TOUCH.mx; mz=TOUCH.mz; fire=TOUCH.fire; if(TOUCH.tap){ NET.tapN++; TOUCH.tap=0; } }
  for(const k of [KEYS[0],KEYS[1]]){ if(down.has(k.left))mx-=1; if(down.has(k.right))mx+=1; if(down.has(k.up))mz-=1; if(down.has(k.down))mz+=1; if(down.has(k.fire)) fire=true; }
  let aim=TOUCH.aim, aa=TOUCH.aa; const pr=readPad(pads()[0]);
  if(pr){ if(pr.mv){mx=pr.mx;mz=pr.mz;} if(pr.fire) fire=true; if(pr.aim){aim=true;aa=pr.aa;} }
  try{ NET.conn.send({k:'i',mx:r2(mx),mz:r2(mz),fire:fire?1:0,aim:aim?1:0,aa:r2(aa),tap:NET.tapN}); }catch(_){}
}
// il client disegna la partita dell'host: niente regole in locale, solo movimento morbido, animazioni ed effetti
function cockClientUpdate(dt){ cockUpdate(dt,false); }
function netClientFrame(t,dt){
  const k=Math.min(1,dt*14);
  for(const p of players){
    if(!p.active){ p.mesh.visible=p.bar.visible=false; if(p.tpRing) p.tpRing.visible=false; continue; }
    if(p.tx!==undefined){ if(Math.hypot(p.tx-p.x,p.tz-p.z)>3){p.x=p.tx;p.z=p.tz;} else {p.x+=(p.tx-p.x)*k;p.z+=(p.tz-p.z)*k;}
      let da=p.ta-p.angle; da=Math.atan2(Math.sin(da),Math.cos(da)); p.angle+=da*k; }
    p.mv=p.mvN?1:0; if(p.mv) p.ph+=dt*9*p.spdBase;
    if(p.hitT>0) p.hitT=Math.max(0,p.hitT-dt);
    if(p.swing) swingAnim(p,dt); p.anim(dt); p.sync();
  }
  for(const m of minions){ m.t+=dt; if(m.tx!==undefined){ m.x+=(m.tx-m.x)*k; m.z+=(m.tz-m.z)*k; }
    m.mesh.position.set(m.x,m.type==='c'?.02:.1+Math.abs(Math.sin(m.t*(m.type==='b'?5:9)))*.12,m.z); if(m.ry!==undefined) m.mesh.rotation.y=m.ry;
    const U=m.mesh.userData; U.tip.scale.setScalar(Math.sin(m.t*(m.near?30:10))>0?.07:.04); if(m.type==='c') U.legs.forEach((l,k)=>l.rotation.y=Math.sin(m.t*26+k*1.7)*.5); else U.ring.material.color.setHex(m.near?0xff1744:0x76ff03);
    if(m.slowT>0){ m.slowT-=dt; if(m.slowT<=0&&m.goo) m.goo.visible=false; } }
  if(SOC.ball&&SOC.ball.tx!==undefined){ const B=SOC.ball, ox=B.x, oz=B.z; B.x+=(B.tx-B.x)*k; B.z+=(B.tz-B.z)*k; B.mesh.position.set(B.x,BALL_R,B.z);
    const dx=B.x-ox, dz=B.z-oz, d=Math.hypot(dx,dz); if(d>1e-4) B.mesh.rotateOnWorldAxis(new THREE.Vector3(dz/d,0,-dx/d),d/BALL_R); }
  updateProjectiles(dt); oilUpdate(dt); updateStrikes(dt); updateSharks(dt); updateBusEvent(dt);
  if(mapKey==='stone') rexUpdate(dt,false); else if(mapKey==='cock') cockClientUpdate(dt); else if(mapKey==='mola') molaUpdate(dt,false); else if(mapKey==='iper') cartUpdate(dt,false); else if(mapKey==='porto') dropUpdate(dt,false); else if(mapKey==='parch') pcarUpdate(dt,false);
  for(const f of purpleFlames){ f.t+=dt; animPurpleFlame(f,f.t); }
  animateItems(t,dt,false); if(KOTH.mesh&&KOTH.mesh.parent) kothUpdate(dt,false); tdClientFrame(dt);
  updateFx(dt); SPK.update(dt); updateShofar(dt); updateStrands(dt); updDmgNums(dt);
  const me=players[NET.slot]; if(IS_TOUCH&&me&&me.active) camFollow(dt,me);
  const cp=cam.position.clone(); if(shakeA>.005){cam.position.x+=(Math.random()-.5)*shakeA;cam.position.z+=(Math.random()-.5)*shakeA;shakeA*=Math.exp(-dt*9);}
  renderer.render(scene,cam); cam.position.copy(cp);
  requestAnimationFrame(loop);
}
if(NET_ROLE==='host') hostOpen();
showMenu();
requestAnimationFrame(loop);
